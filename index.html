<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝塚舞台：精密採寸＆全部署DXポータル</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 0.9rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        
        /* 入力エリア */
        .input-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.55rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
        input, select { width: 100%; padding: 6px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }

        /* カメラエリア */
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 12px; border: 2px solid #3b82f6; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        video { display: none; }
        .flip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 0.7rem; z-index: 110; cursor: pointer; }
        .timer-overlay { position: absolute; top: 15px; left: 15px; background: rgba(239, 68, 68, 0.9); color: white; padding: 8px 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; display: none; z-index: 100; }
        .guide-msg { position: absolute; top: 50%; width: 100%; text-align: center; color: white; pointer-events: none; transform: translateY(-50%); }
        .guide-inner { background: rgba(0,0,0,0.7); display: inline-block; padding: 12px 20px; border-radius: 10px; font-size: 0.85rem; border: 1px solid #3b82f6; line-height: 1.4; }

        /* 結果グリッド */
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .result-item { background: #fff; padding: 10px 4px; border-radius: 8px; text-align: center; border: 2px solid #e2e8f0; }
        .result-item.fixed { border-color: #10b981; background: #f0fdf4; }
        .res-val { font-size: 0.8rem; font-weight: bold; color: #1e293b; display: block; }
        .res-label { font-size: 0.5rem; color: #64748b; }

        .btn-main { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #059669; }

        /* カタログ */
        #catalog-section { display: none; width: 100%; margin-top: 15px; }
        .user-notice { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 0.65rem; color: #9a3412; line-height: 1.4; }
        .item-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fff; }
        .item-name { font-weight: bold; font-size: 0.75rem; border-left: 4px solid #3b82f6; padding-left: 8px; margin-bottom: 8px; }
        .opt-wrap { display: flex; flex-wrap: wrap; gap: 4px; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 6px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; min-width: 45px; }
        .opt-btn.selected { background: #3b82f6 !important; color: white; border-color: #3b82f6; }
        .ai-rec { outline: 3px solid #10b981; background: #f0fdf4 !important; position: relative; }
        .ai-rec::after { content: "推奨"; position: absolute; top: -10px; right: -2px; background: #10b981; color: white; font-size: 0.5rem; padding: 1px 4px; border-radius: 3px; z-index: 10; }

        /* 申請内容プレビュー */
        .order-summary { background: #f8fafc; border: 2px solid #3b82f6; border-radius: 12px; padding: 12px; margin: 15px 0; }
        .order-summary h3 { font-size: 0.8rem; margin: 0 0 8px 0; color: #1e293b; border-bottom: 1px solid #cbd5e1; padding-bottom: 5px; }
        .summary-list { list-style: none; padding: 0; margin: 0; font-size: 0.75rem; color: #334155; }
        .summary-list li { margin-bottom: 4px; display: flex; justify-content: space-between; border-bottom: 1px dashed #e2e8f0; padding-bottom: 2px; }
        .summary-list li b { color: #2563eb; }

        /* 資料ビューア */
        .data-viewer { margin-top: 10px; border: 2px solid #3b82f6; border-radius: 8px; overflow: hidden; }
        .data-header { background: #3b82f6; color: white; padding: 10px; font-size: 0.75rem; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .data-body { display: none; padding: 10px; background: #fff; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.65rem; margin-bottom: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 2px; text-align: center; }
        .row-highlight { background: #fef9c3 !important; border: 2px solid #f59e0b !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：精密3D採寸＆全部署DX</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="165"></div>
        <div class="input-group"><label>性別</label><select id="genderInput" onchange="resetCatalog()"><option value="男">男性</option><option value="女">女性</option></select></div>
        <div class="input-group"><label>部署</label>
            <select id="deptInput" onchange="resetCatalog()">
                <option value="大道具">大道具係</option><option value="小道具">小道具係</option><option value="衣裳">衣裳係</option>
                <option value="照明">照明係</option><option value="音響">音響係</option><option value="進行">進行係</option>
                <option value="背景">背景係</option><option value="装置">装置係</option><option value="舞台幕">舞台幕係</option>
                <option value="電飾">電飾係</option><option value="管理">公演管理</option>
            </select>
        </div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="25.0" step="0.5"></div>
        <div class="input-group"><label>利き手</label><select id="handInput"><option value="右">右</option><option value="左">左</option></select></div>
    </div>

    <div id="canvas-container">
        <button class="flip-btn" onclick="toggleCamera()">📷 カメラ切替</button>
        <div id="timerBox" class="timer-overlay">準備中</div>
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="output_canvas"></canvas>
        <div class="guide-msg" id="guideMsg"><div class="guide-inner" id="guideText">足元まで画面に入れてください</div></div>
    </div>

    <div class="result-grid">
        <div class="result-item"><span class="res-val" id="val-sh">-- cm</span><span class="res-label">肩幅</span></div>
        <div class="result-item"><span class="res-val" id="val-waist">-- cm</span><span class="res-label">ウエスト</span></div>
        <div class="result-item"><span class="res-val" id="val-sl">-- cm</span><span class="res-label">袖丈</span></div>
        <div class="result-item"><span class="res-val" id="val-in">-- cm</span><span class="res-label">股下</span></div>
    </div>

    <button id="mainBtn" class="btn-main" onclick="runSequence()">精密3D採寸スタート</button>

    <div id="catalog-section">
        <div class="user-notice">
            表示数値はAIの暫定値です。<b>下の「資料」を確認し、ご自身でサイズを変更・選定してください。</b>
        </div>

        <div id="dynamic-catalog"></div>

        <!-- リアルタイム申請リスト表示 -->
        <div class="order-summary" id="orderSummaryBox">
            <h3>【現在の選択内容の確認】</h3>
            <ul class="summary-list" id="summaryList">
                <li>サイズを選択してください...</li>
            </ul>
        </div>

        <div class="data-viewer">
            <div class="data-header" onclick="toggleTable()"><span>📄 資料：各製品サイズ表を照合する</span><span id="arrow">▼ 表示</span></div>
            <div id="table-content" class="data-body"></div>
        </div>

        <button class="btn-main" style="background:#3b82f6; margin-top:20px;" onclick="copyResult()">申請内容をコピーして終了</button>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    let isFixed = false, isUserCamera = true, cameraInstance = null, finalData = {}, selections = {};

    const MASTER = {
        jackets_blk: [{s:"S",sh:46.0},{s:"M",sh:47.5},{s:"L",sh:49.0},{s:"LL",sh:50.5},{s:"3L",sh:52.0},{s:"4L",sh:53.5},{s:"5L",sh:55.0}],
        jackets_nvy: [{s:"S",sh:49.0},{s:"M",sh:50.5},{s:"L",sh:52.0},{s:"LL",sh:53.5},{s:"3L",sh:55.0},{s:"4L",sh:56.5},{s:"5L",sh:58.0}],
        shirts: [{s:"S",sh:46,b:108},{s:"M",sh:48,b:112},{s:"L",sh:50,b:120},{s:"LL",sh:52,b:128},{s:"3L",sh:54,b:136},{s:"4L",sh:55,b:140},{s:"5L",sh:56,b:144}],
        pants_blk: ["70","73","76","79","82","85","88","91","95","100","105","110"],
        pants_z: [{d:"W59",r:72},{d:"W61",r:74},{d:"W64",r:77},{d:"W67",r:80},{d:"W70",r:83},{d:"W73",r:86},{d:"W76",r:89},{d:"W81",r:94}],
        gomu: [{s:"3S",w:72},{s:"SS",w:76},{s:"S",w:80},{s:"M",w:84},{s:"L",w:88},{s:"LL",w:92}]
    };

    function speak(t) { speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
    function onResults(results) {
        canvasCtx.save(); canvasCtx.clearRect(0,0,640,480); canvasCtx.drawImage(results.image, 0,0,640,480);
        if (results.poseLandmarks && !isFixed) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color:'#00FF00', lineWidth:4});
            const lm = results.poseLandmarks, h = parseFloat(document.getElementById('heightInput').value);
            const cmPx = h / (Math.abs(Math.max(lm[27].y, lm[28].y) - lm[0].y) * 1.15);
            liveData = { sh: Math.abs(lm[11].x-lm[12].x)*640*cmPx*1.35, w_w: Math.abs(lm[23].x-lm[24].x)*640*cmPx*1.8, ins: Math.abs(lm[23].y-Math.max(lm[27].y, lm[28].y))*480*cmPx*1.05, w_d: Math.abs(lm[11].x-lm[12].x)*640*cmPx*4.1 };
            document.getElementById('val-sh').innerText = (liveData.sh/640).toFixed(1)+"cm"; 
            document.getElementById('val-waist').innerText = ((liveData.w_w*1.6)/640).toFixed(1)+"cm";
            document.getElementById('val-in').innerText = (liveData.ins/480).toFixed(1)+"cm";
        }
        canvasCtx.restore();
    }

    async function toggleCamera() { isUserCamera = !isUserCamera; if (cameraInstance) { await cameraInstance.stop(); startCamera(); } }
    function startCamera() { cameraInstance = new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480, facingMode: isUserCamera ? 'user' : 'environment' }); cameraInstance.start(); }

    function countdown(sec, label) {
        return new Promise(resolve => {
            let c = sec;
            document.getElementById('timerBox').style.display = "block";
            const timer = setInterval(() => {
                document.getElementById('timerBox').innerText = label + ": " + c;
                if(c <= 3 && c > 0) speak(c.toString());
                if(c <= 0) { clearInterval(timer); resolve(); }
                c--;
            }, 1000);
        });
    }

    async function runSequence() {
        document.getElementById('mainBtn').disabled = true; isFixed = false;
        speak("正面を向いてください。10秒計測します。");
        await countdown(10, "正面");
        finalData = JSON.parse(JSON.stringify(liveData));
        speak("右に向いてください。厚みを計測します。");
        await countdown(10, "側面");
        const a = (finalData.w_w/640)/2, b = (liveData.w_d/640)/2, hv = Math.pow(a-b,2)/Math.pow(a+b,2);
        finalData.waist = Math.PI * (a+b) * (1 + (3*hv)/(10 + Math.sqrt(4-3*hv))) * 640;
        finalize();
    }

    function finalize() {
        isFixed = true; speak("計測完了。資料と照合してください。");
        document.getElementById('catalog-section').style.display = "block";
        document.getElementById('canvas-container').style.display = "none";
        document.getElementById('val-waist').innerText = (finalData.waist).toFixed(1) + "cm";
        document.querySelectorAll('.result-item').forEach(el => el.classList.add('fixed'));
        renderCatalog(); buildReferenceTable();
    }

    function renderCatalog() {
        const dept = document.getElementById('deptInput').value, container = document.getElementById('dynamic-catalog');
        const isNavy = ["背景", "装置", "舞台幕"].includes(dept); // 大道具は黒
        const isIsho = (dept === "衣裳");
        const jTable = isNavy ? MASTER.jackets_nvy : MASTER.jackets_blk;
        let jRec = jTable[0].s; for(let i of jTable) if((finalData.sh/640) >= i.sh - 0.5) jRec = i.s;
        let sRec = MASTER.shirts[0].s; for(let i of MASTER.shirts) if((finalData.sh/640) >= i.sh - 1) sRec = i.s;

        let html = `<div class="item-card"><div class="item-name">${isNavy?'上着：紺/製作型':'上着：黒/公演型'}</div><div class="opt-wrap">${jTable.map(i=>`<button class="opt-btn ${i.s===jRec?'ai-rec':''}" onclick="sel(this,'上着','${i.s}')">${i.s}</button>`).join('')}</div></div>`;
        html += `<div class="item-card"><div class="item-name">長袖黒シャツ (開襟)</div><div class="opt-wrap">${MASTER.shirts.map(i=>`<button class="opt-btn ${i.s===sRec?'ai-rec':''}" onclick="sel(this,'シャツ','${i.s}')">${i.s}</button>`).join('')}</div></div>`;
        
        if (isIsho) {
            html += `<div class="item-card"><div class="item-name">衣裳係：支給セット</div><div class="opt-wrap">${MASTER.gomu.map(i=>`<button class="opt-btn" onclick="sel(this,'総ゴムP','${i.s}')">${i.s}</button>`).join('')}<button class="opt-btn" onclick="sel(this,'たび靴','支給サイズ')">たび靴</button><button class="opt-btn" onclick="sel(this,'エプロン','F')">エプロン</button></div></div>`;
        } else {
            html += `<div class="item-card"><div class="item-name">ズボン (${isNavy?'紺':'黒'})</div><div class="opt-wrap">${(isNavy?MASTER.pants_z.map(i=>i.d):MASTER.pants_blk.map(i=>"W"+i)).map(v=>`<button class="opt-btn" onclick="sel(this,'ズボン','${v}')">${v}</button>`).join('')}</div></div>`;
        }
        html += `<div class="item-card"><div class="item-name">共通アイテム</div><div class="opt-wrap">${["S","M","L","LL","3L"].map(v=>`<button class="opt-btn" onclick="sel(this,'共通品','${v}')">${v}</button>`).join('')}</div></div>`;
        container.innerHTML = html;
    }

    function sel(btn, cat, val) {
        btn.parentElement.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        selections[cat] = val;
        updateSummary();
    }

    function updateSummary() {
        const list = document.getElementById('summaryList');
        list.innerHTML = "";
        for (let key in selections) {
            list.innerHTML += `<li>${key}: <b>${selections[key]}</b></li>`;
        }
    }

    function buildReferenceTable() {
        const content = document.getElementById('table-content'), dept = document.getElementById('deptInput').value, isNavy = ["背景", "装置", "舞台幕"].includes(dept);
        const curSH = finalData.sh/640, curW = finalData.waist;
        let sRows = MASTER.shirts.map(i => `<tr class="${(curSH >= i.sh-1 && curSH < i.sh+1.5)?'row-highlight':''}"><td>${i.s}</td><td>${i.sh}</td><td>${i.b}</td></tr>`).join('');
        let jRows = (isNavy?MASTER.jackets_nvy:MASTER.jackets_blk).map(i => `<tr class="${(curSH >= i.sh-0.5 && curSH < i.sh+1.5)?'row-highlight':''}"><td>${i.s}</td><td>${i.sh}</td></tr>`).join('');
        content.innerHTML = `<p><b>■ シャツ表</b></p><table><tr><th>サイズ</th><th>肩巾</th><th>ウエスト</th></tr>${sRows}</table><p><b>■ 上着表</b></p><table><tr><th>サイズ</th><th>肩巾</th></tr>${jRows}</table>`;
    }

    function toggleTable() { const b = document.getElementById('table-content'), a = document.getElementById('arrow'); b.style.display = (b.style.display==="block")?"none":"block"; a.innerText = (b.style.display==="block")?"▲ 閉じる":"▼ 表示"; }

    function copyResult() {
        let text = `【宝塚舞台 採寸報告】\n氏名: ${document.getElementById('nameInput').value}\n部署: ${document.getElementById('deptInput').value}\n身長: ${document.getElementById('heightInput').value}cm / 靴: ${document.getElementById('shoeInput').value}cm\n----------------\n■ AI実測値\n肩幅: ${(finalData.sh/640).toFixed(1)}cm\nウエスト: ${finalData.waist.toFixed(1)}cm\n股下: ${(finalData.ins/480).toFixed(1)}cm\n----------------\n■ 選択サイズ\n`;
        for (let k in selections) text += `・${k}: ${selections[k]}\n`;
        navigator.clipboard.writeText(text).then(() => alert("申請内容をコピーしました！"));
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
    pose.onResults(onResults);
    startCamera();
</script>
</body>
</html>
