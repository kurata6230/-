<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝塚舞台：精密3D採寸＆製品照合DX</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 0.9rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        
        .input-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; background: #f8fafc; padding: 8px; border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.55rem; font-weight: bold; color: #64748b; }
        input, select { width: 100%; padding: 5px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 4px; }

        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 10px; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        .timer-overlay { position: absolute; top: 10px; left: 10px; background: rgba(239, 68, 68, 0.9); color: white; padding: 5px 12px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; display: none; z-index: 100; }
        
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
        .result-item { background: #fff; padding: 8px 4px; border-radius: 6px; text-align: center; border: 2px solid #e2e8f0; }
        .result-item.fixed { border-color: #10b981; background: #f0fdf4; box-shadow: 0 0 5px rgba(16,185,129,0.3); }
        .res-val { font-size: 0.8rem; font-weight: bold; color: #1e293b; display: block; margin-bottom: 2px; }
        .res-label { font-size: 0.5rem; color: #64748b; }

        .btn-main { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        #catalog-section { display: none; width: 100%; margin-top: 15px; border-top: 2px dashed #cbd5e1; padding-top: 10px; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 6px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; margin: 2px; }
        .ai-rec { outline: 3px solid #10b981; background: #f0fdf4 !important; position: relative; }
        .selected { background: #3b82f6 !important; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：精密3D採寸＆製品照合</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="165"></div>
        <div class="input-group"><label>部署</label>
            <select id="deptInput">
                <option value="制作">制作</option><option value="大道具">大道具</option><option value="小道具">小道具</option>
                <option value="進行">進行</option><option value="衣裳">衣裳</option><option value="背景">背景</option>
            </select>
        </div>
        <div class="input-group"><label>性別</label><select id="genderInput"><option value="女">女性</option><option value="男">男性</option></select></div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="24.5" step="0.5"></div>
        <div class="input-group"><label>利き手</label><select id="handInput"><option value="右">右</option><option value="左">左</option></select></div>
    </div>

    <div id="canvas-container">
        <div id="timerBox" class="timer-overlay">準備中</div>
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="result-grid">
        <div class="result-item" id="box-sh"><span class="res-val" id="val-sh">-- cm</span><span class="res-label">肩幅</span></div>
        <div class="result-item" id="box-waist"><span class="res-val" id="val-waist">-- cm</span><span class="res-label">ウエスト</span></div>
        <div class="result-item" id="box-sl"><span class="res-val" id="val-sl">-- cm</span><span class="res-label">袖丈</span></div>
        <div class="result-item" id="box-in"><span class="res-val" id="val-in">-- cm</span><span class="res-label">股下</span></div>
    </div>

    <button id="mainBtn" class="btn-main" onclick="runSequence()">精密3D採寸スタート</button>

    <div id="catalog-section">
        <div id="dynamic-catalog"></div>
        <button class="btn-main" style="background:#3b82f6; margin-top:10px;" onclick="copyResult()">結果をコピー</button>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    let isFixed = false, liveData = {}, finalData = {};

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0,0,canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0,0,canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks && !isFixed) {
            // 骨格線の描画を確実に実行
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color:'#00FF00', lineWidth:4});
            
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);

            // 【修正】正規化座標系での比率計算
            // 肩の高さから地面（足首）までの高さを基準にする
            const groundY = Math.max(lm[27].y, lm[28].y, lm[29].y, lm[30].y);
            const headY = lm[0].y;
            const fullHeightRatio = Math.abs(groundY - headY);
            
            // 1単位（画面の縦幅100%分）あたりのcmを算出
            const cmPerUnit = h / (fullHeightRatio * 1.15); 

            // 各部位の計算（ピクセルを掛けず、比率にcmPerUnitを掛ける）
            liveData.sh = Math.abs(lm[11].x - lm[12].x) * cmPerUnit * 1.25;
            liveData.w_width = Math.abs(lm[23].x - lm[24].x) * cmPerUnit * 1.8;
            liveData.sl = Math.sqrt(Math.pow(lm[11].x-lm[15].x,2)+Math.pow(lm[11].y-lm[15].y,2)) * cmPerUnit;
            liveData.inseam = Math.abs(groundY - (lm[23].y + lm[24].y)/2) * cmPerUnit * 1.1;
            liveData.w_depth = Math.abs(lm[11].x - lm[12].x) * cmPerUnit * 4.0; // 側面用

            // リアルタイム表示更新
            document.getElementById('val-sh').innerText = liveData.sh.toFixed(1) + " cm";
            document.getElementById('val-sl').innerText = liveData.sl.toFixed(1) + " cm";
            document.getElementById('val-in').innerText = liveData.inseam.toFixed(1) + " cm";
            document.getElementById('val-waist').innerText = (liveData.w_width * 1.6).toFixed(1) + " cm";
        }
        canvasCtx.restore();
    }

    async function runSequence() {
        document.getElementById('mainBtn').disabled = true;
        document.getElementById('timerBox').style.display = "block";
        
        // 正面計測
        document.getElementById('timerBox').innerText = "正面計測中...";
        await countdown(8);
        finalData.sh = liveData.sh; finalData.sl = liveData.sl; finalData.in = liveData.inseam;
        const fw = liveData.w_width;

        // 側面計測
        speechSynthesis.speak(new SpeechSynthesisUtterance("右に向いてください"));
        document.getElementById('timerBox').innerText = "側面計測中...";
        await countdown(8);
        const sd = liveData.w_depth;

        // 立体ウエスト計算 (楕円近似)
        const a = fw/2, b = sd/2;
        const h_v = Math.pow(a-b,2)/Math.pow(a+b,2);
        finalData.waist = Math.PI * (a+b) * (1 + (3*h_v)/(10 + Math.sqrt(4-3*h_v)));

        finalize();
    }

    function countdown(sec) {
        return new Promise(res => {
            let c = sec;
            const t = setInterval(() => {
                document.getElementById('timerBox').innerText = `あと ${c} 秒`;
                if(c <= 0) { clearInterval(t); res(); }
                c--;
            }, 1000);
        });
    }

    function finalize() {
        isFixed = true;
        document.getElementById('val-sh').innerText = finalData.sh.toFixed(1) + " cm";
        document.getElementById('val-sl').innerText = finalData.sl.toFixed(1) + " cm";
        document.getElementById('val-in').innerText = finalData.in.toFixed(1) + " cm";
        document.getElementById('val-waist').innerText = finalData.waist.toFixed(1) + " cm";
        
        document.querySelectorAll('.result-item').forEach(el => el.classList.add('fixed'));
        document.getElementById('canvas-container').style.display = "none";
        document.getElementById('mainBtn').style.display = "none";
        document.getElementById('catalog-section').style.display = "block";
        renderCatalog();
    }

    function renderCatalog() {
        const dept = document.getElementById('deptInput').value;
        const isNavy = ["大道具", "背景", "制作"].includes(dept);
        const container = document.getElementById('dynamic-catalog');
        
        // 推奨上着
        const jTable = isNavy ? [{s:"S",sh:49.0},{s:"M",sh:50.5},{s:"L",sh:52.0},{s:"LL",sh:53.5},{s:"3L",sh:55.0}] : [{s:"S",sh:46.0},{s:"M",sh:47.5},{s:"L",sh:49.0},{s:"LL",sh:50.5},{s:"3L",sh:52.0}];
        let jRec = jTable[0].s;
        for(let item of jTable) if(finalData.sh >= item.sh - 0.5) jRec = item.s;

        container.innerHTML = `
            <div style="font-weight:bold; font-size:0.8rem; margin-bottom:10px;">AI推奨サイズ (資料照合済み)</div>
            <div class="item-card"><div class="item-name">${isNavy?'製作型 上着(紺)':'公演型 上着(黒)'}</div>
                <div class="opt-wrap">${jTable.map(i=>`<button class="opt-btn ${i.s===jRec?'ai-rec':''}" onclick="sel(this,'上着','${i.s}')">${i.s}</button>`).join('')}</div>
            </div>
        `;
    }

    function sel(btn, cat, val) {
        btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function copyResult() {
        const res = `採寸結果: 肩幅${finalData.sh.toFixed(1)}cm, 腰${finalData.waist.toFixed(1)}cm, 股下${finalData.in.toFixed(1)}cm`;
        navigator.clipboard.writeText(res).then(() => alert("コピーしました"));
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
    pose.onResults(onResults);
    new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480 }).start();
</script>
</body>
</html>
