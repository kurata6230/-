<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝塚舞台：採寸＆備品DXポータル</title>
    <!-- ライブラリの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 550px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 0.95rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        .security-note { font-size: 0.6rem; color: #059669; background: #f0fdf4; padding: 6px; border-radius: 6px; margin-bottom: 8px; text-align: center; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.6rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
        input, select { width: 100%; padding: 8px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 10px; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        .flip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 8px 15px; border-radius: 20px; font-size: 0.65rem; z-index: 100; }
        .guide-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .head-target { position: absolute; top: 10%; left: 35%; width: 30%; height: 12%; border: 2px dashed #10b981; border-radius: 50%; opacity: 0.5; }
        .foot-target { position: absolute; bottom: 8%; left: 20%; width: 60%; border-bottom: 4px solid #10b981; opacity: 0.7; }
        .status-msg { position: absolute; bottom: 12%; width: 100%; text-align: center; color: white; font-size: 0.7rem; font-weight: bold; background: rgba(0,0,0,0.6); padding: 5px 0; }
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 15px; }
        .result-item { background: #f1f5f9; padding: 6px; border-radius: 6px; text-align: center; border: 1px solid #e2e8f0; }
        .res-label { font-size: 0.5rem; color: #64748b; display: block; }
        .res-val { font-size: 0.8rem; font-weight: bold; color: #2563eb; }
        #catalog-section { display: none; border-top: 2px dashed #cbd5e1; padding-top: 15px; width: 100%; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 7px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; margin-right: 3px; min-width: 40px; }
        .opt-btn.selected { background: #3b82f6; color: white; }
        .action-btn { width: 100%; padding: 18px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-measure { background: #10b981; color: white; }
        .btn-order { background: #3b82f6; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：採寸＆備品DXポータル</h1>
    <div class="security-note">画像は端末内でのみ処理されます。</div>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>性別</label><select id="genderInput" onchange="updateUI()"><option value="女">女性</option><option value="男">男性</option></select></div>
        <div class="input-group"><label>配属部署</label><select id="deptInput" onchange="updateUI()"><option value="大道具">大道具</option><option value="衣裳">衣裳</option><option value="進行">進行</option><option value="照明">照明</option><option value="音響">音響</option><option value="背景">背景</option></select></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="160"></div>
    </div>

    <div id="canvas-container">
        <button class="flip-btn" onclick="toggleCamera()">📷 カメラ切替</button>
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="output_canvas"></canvas>
        <div class="guide-overlay">
            <div class="head-target"></div><div class="foot-target"></div>
            <div id="statusBox" class="status-msg">システム起動中...</div>
        </div>
    </div>

    <div class="result-grid">
        <div class="result-item"><span class="res-label">肩幅</span><span class="res-val"><span id="shW">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">ウエスト</span><span class="res-val"><span id="waist">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">袖丈</span><span class="res-val"><span id="slL">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">股下</span><span class="res-val"><span id="inL">--</span> cm</span></div>
    </div>

    <button id="mainBtn" class="action-btn btn-measure" onclick="startSelfTimer()">採寸スタート (10秒)</button>

    <div id="catalog-section">
        <div id="items-area"></div>
        <button class="action-btn btn-order" onclick="finishOrder()">申請内容を確定してコピー</button>
    </div>
    <textarea id="resultText" style="display:none; width:100%; height:200px; margin-top:10px;"></textarea>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusBox = document.getElementById('statusBox');
    
    let measurements = { shoulder:"--", waist:"--", sleeve:"--", inseam:"--" };
    let isUserCamera = true;
    let cameraInstance = null;

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            const lm = results.poseLandmarks;
            const userH = parseFloat(document.getElementById('heightInput').value);
            
            // 鼻と足首の認識
            const nose = lm[0];
            const ankleY = (lm[27].y + lm[28].y) / 2;
            const bodyRatio = Math.abs(ankleY - nose.y);

            // 認識感度を上げつつ異常値をガード (Visibility > 0.3)
            if (nose.visibility > 0.3 && (lm[27].visibility > 0.3 || lm[28].visibility > 0.3)) {
                const factor = userH / (bodyRatio * 1.15); 

                if (factor > 50 && factor < 400) {
                    statusBox.innerText = "● 検知中：そのまま静止してください";
                    statusBox.style.background = "rgba(16, 185, 129, 0.8)";

                    measurements.shoulder = (Math.sqrt(Math.pow(lm[11].x-lm[12].x, 2)+Math.pow(lm[11].y-lm[12].y, 2)) * factor).toFixed(1);
                    measurements.waist = (Math.abs(lm[23].x - lm[24].x) * factor * 2.4).toFixed(1);
                    measurements.sleeve = (Math.sqrt(Math.pow(lm[11].x-lm[15].x, 2)+Math.pow(lm[11].y-lm[15].y, 2)) * factor).toFixed(1);
                    measurements.inseam = (Math.abs(lm[23].y - lm[27].y) * factor).toFixed(1);

                    document.getElementById('shW').innerText = measurements.shoulder;
                    document.getElementById('waist').innerText = measurements.waist;
                    document.getElementById('slL').innerText = measurements.sleeve;
                    document.getElementById('inL').innerText = measurements.inseam;
                } else {
                    statusBox.innerText = "もう少し離れてください";
                    statusBox.style.background = "rgba(239, 68, 68, 0.8)";
                }
            } else {
                statusBox.innerText = "足元を緑の線に合わせてください";
                statusBox.style.background = "rgba(239, 68, 68, 0.8)";
            }
        }
        canvasCtx.restore();
    }

    async function toggleCamera() {
        isUserCamera = !isUserCamera;
        if (cameraInstance) { await cameraInstance.stop(); startCamera(); }
    }

    function startCamera() {
        cameraInstance = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 640, height: 480, facingMode: isUserCamera ? 'user' : 'environment'
        });
        cameraInstance.start().then(() => { statusBox.innerText = "カメラ起動完了"; });
    }

    function startSelfTimer() {
        let count = 10;
        document.getElementById('mainBtn').disabled = true;
        const timer = setInterval(() => {
            document.getElementById('mainBtn').innerText = `確定まで ${count} 秒...`;
            if (count <= 3 && count > 0) window.speechSynthesis.speak(new SpeechSynthesisUtterance(count));
            if (count <= 0) {
                clearInterval(timer);
                if (measurements.shoulder === "--") {
                    alert("計測失敗。離れて再試行してください。");
                    location.reload();
                } else {
                    document.getElementById('mainBtn').style.display = "none";
                    document.getElementById('catalog-section').style.display = "block";
                }
            }
            count--;
        }, 1000);
    }

    function finishOrder() {
        const res = `【採寸報告】肩幅:${measurements.shoulder}cm / 腰:${measurements.waist}cm`;
        document.getElementById('resultText').value = res;
        document.getElementById('resultText').style.display = "block";
        navigator.clipboard.writeText(res); alert("コピー完了");
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);
    startCamera();
</script>
</body>
</html>
