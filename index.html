<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝塚舞台：採寸ポータル【感度調整版】</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 550px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 1rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.6rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
        input, select { width: 100%; padding: 8px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; }
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 10px; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        .flip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 0.6rem; cursor: pointer; z-index: 100; }
        .guide-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .head-target { position: absolute; top: 10%; left: 30%; width: 40%; height: 15%; border: 2px dashed #10b981; border-radius: 50%; }
        .foot-target { position: absolute; bottom: 8%; left: 20%; width: 60%; border-bottom: 3px solid #10b981; }
        .status-msg { position: absolute; bottom: 15%; width: 100%; text-align: center; color: white; font-size: 0.75rem; font-weight: bold; background: rgba(239, 68, 68, 0.8); padding: 6px 0; }
        .status-msg.ok { background: rgba(16, 185, 129, 0.8); }
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .result-item { background: #f1f5f9; padding: 5px; border-radius: 6px; text-align: center; border: 1px solid #e2e8f0; }
        .res-label { font-size: 0.5rem; color: #64748b; display: block; }
        .res-val { font-size: 0.85rem; font-weight: bold; color: #2563eb; }
        #catalog-section { display: none; border-top: 2px dashed #cbd5e1; padding-top: 15px; width: 100%; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 6px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; margin-right: 3px; min-width: 35px; }
        .opt-btn.selected { background: #3b82f6; color: white; }
        .action-btn { width: 100%; padding: 18px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-measure { background: #10b981; color: white; }
        .btn-order { background: #3b82f6; color: white; }
    </style>
</head>
<body>
<div class="card">
    <h1>宝塚舞台：2026年度 採寸ポータル</h1>
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput"></div>
        <div class="input-group"><label>性別</label><select id="genderInput"><option value="女">女性</option><option value="男">男性</option></select></div>
        <div class="input-group"><label>部署</label><select id="deptInput"><option value="大道具">大道具</option><option value="衣裳">衣裳</option><option value="進行">進行</option></select></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="160"></div>
    </div>
    <div id="canvas-container">
        <button class="flip-btn" onclick="toggleCamera()">📷 カメラ切替</button>
        <video id="input_video"></video>
        <canvas id="output_canvas"></canvas>
        <div class="guide-overlay"><div class="head-target"></div><div class="foot-target"></div><div id="statusBox" class="status-msg">読込中...</div></div>
    </div>
    <div class="result-grid">
        <div class="result-item"><span class="res-label">肩幅</span><span class="res-val"><span id="shW">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">ウエスト</span><span class="res-val"><span id="waist">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">袖丈</span><span class="res-val"><span id="slL">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">股下</span><span class="res-val"><span id="inL">--</span> cm</span></div>
    </div>
    <button id="mainBtn" class="action-btn btn-measure" onclick="startSelfTimer()">採寸スタート (10秒)</button>
    <div id="catalog-section">
        <button class="action-btn btn-order" onclick="finishOrder()">内容を確定してコピー</button>
    </div>
    <textarea id="resultText" style="display:none; width:100%; height:150px; margin-top:10px;"></textarea>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const mainBtn = document.getElementById('mainBtn');
    const statusBox = document.getElementById('statusBox');
    
    let measurements = { shoulder:"--", waist:"--", sleeve:"--", inseam:"--" };
    let isUserCamera = true;
    let camera = null;

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);
            
            // 判定基準を緩和 (0.8 → 0.5)
            const nose = lm[0];
            const leftAnkle = lm[27];
            const rightAnkle = lm[28];

            if (nose.visibility > 0.5 && (leftAnkle.visibility > 0.5 || rightAnkle.visibility > 0.5)) {
                const bodyPx = Math.abs(leftAnkle.y - nose.y);
                const ratio = h / (bodyPx * 1.15); // 補正係数も少し調整

                if (ratio < 12.0 && ratio > 0.1) {
                    statusBox.innerText = "OK！そのまま静止してください";
                    statusBox.classList.add('ok');

                    measurements.shoulder = (Math.sqrt(Math.pow(lm[11].x-lm[12].x, 2)+Math.pow(lm[11].y-lm[12].y, 2)) * canvasElement.width * ratio).toFixed(1);
                    measurements.waist = (Math.abs(lm[23].x - lm[24].x) * canvasElement.width * ratio * 2.4).toFixed(1);
                    measurements.sleeve = (Math.sqrt(Math.pow(lm[11].x-lm[15].x, 2)+Math.pow(lm[11].y-lm[15].y, 2)) * canvasElement.width * ratio).toFixed(1);
                    measurements.inseam = (Math.abs(lm[23].y - lm[27].y) * canvasElement.height * ratio).toFixed(1);

                    document.getElementById('shW').innerText = measurements.shoulder;
                    document.getElementById('waist').innerText = measurements.waist;
                    document.getElementById('slL').innerText = measurements.sleeve;
                    document.getElementById('inL').innerText = measurements.inseam;
                } else {
                    lockValues("もっと離れてください");
                }
            } else {
                lockValues("足元が映るまで下がってください");
            }
        } else {
            lockValues("カメラに全身を映してください");
        }
        canvasCtx.restore();
    }

    function lockValues(msg) {
        statusBox.innerText = msg;
        statusBox.classList.remove('ok');
        document.getElementById('shW').innerText = "--";
        measurements.shoulder = "--";
    }

    function toggleCamera() { isUserCamera = !isUserCamera; if (camera) { camera.stop(); startCamera(); } }
    function startCamera() {
        camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 640, height: 480, facingMode: isUserCamera ? 'user' : 'environment'
        });
        camera.start();
    }

    function startSelfTimer() {
        let count = 10; mainBtn.disabled = true;
        const timer = setInterval(() => {
            mainBtn.innerText = `あと ${count} 秒...`;
            if (count <= 3 && count > 0) window.speechSynthesis.speak(new SpeechSynthesisUtterance(count));
            if (count <= 0) {
                clearInterval(timer);
                if (measurements.shoulder === "--") {
                    alert("計測失敗。足先まで映るようにもう少し離れてください。");
                    location.reload();
                } else {
                    mainBtn.style.display = "none";
                    document.getElementById('catalog-section').style.display = "block";
                }
            }
            count--;
        }, 1000);
    }

    function finishOrder() {
        let res = `【採寸報告】肩幅:${measurements.shoulder} / ウエスト:${measurements.waist}`;
        document.getElementById('resultText').value = res;
        document.getElementById('resultText').style.display = "block";
        navigator.clipboard.writeText(res); alert("コピーしました。");
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);
    startCamera();
</script>
</body>
</html>
