<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝塚舞台：高精度3D採寸システム</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 550px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 0.9rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; background: #f8fafc; padding: 8px; border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.55rem; font-weight: bold; color: #64748b; }
        input, select { width: 100%; padding: 5px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 4px; }

        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 10px; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        
        .timer-overlay { position: absolute; top: 10px; left: 10px; background: rgba(255,0,0,0.7); color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; display: none; z-index: 100; }
        .guide-msg { position: absolute; top: 50%; width: 100%; text-align: center; color: white; pointer-events: none; }
        .guide-inner { background: rgba(0,0,0,0.6); display: inline-block; padding: 10px 20px; border-radius: 10px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.3); }
        .status-bar { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.5); color: #0f0; font-size: 0.7rem; text-align: center; padding: 4px 0; }

        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
        .result-item { background: #fff; padding: 8px 4px; border-radius: 6px; text-align: center; border: 2px solid #3b82f6; }
        .res-label { font-size: 0.5rem; color: #64748b; display: block; }
        .res-val { font-size: 0.9rem; font-weight: bold; color: #1e293b; }
        .unit { font-size: 0.6rem; margin-left: 2px; }

        .btn-main { width: 100%; padding: 15px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn-main:disabled { background: #94a3b8; }

        #catalog-section { display: none; width: 100%; margin-top: 15px; }
        .ai-rec { outline: 3px solid #10b981; background: #f0fdf4 !important; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 6px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; margin: 2px; min-width: 42px; }
        .selected { background: #3b82f6 !important; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：高精度3D採寸ポータル</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput"></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="165" oninput="updateRealtime()"></div>
        <div class="input-group"><label>部署</label>
            <select id="deptInput" onchange="updateUI()"><option value="制作">制作</option><option value="大道具">大道具</option><option value="衣裳">衣裳</option><option value="進行">進行</option><option value="背景">背景</option></select>
        </div>
        <div class="input-group"><label>性別</label><select id="genderInput" onchange="updateUI()"><option value="女">女性</option><option value="男">男性</option></select></div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="24.5" step="0.5"></div>
        <div class="input-group"><label>利き手</label><select id="handInput"><option value="右">右</option><option value="左">左</option></select></div>
    </div>

    <div id="canvas-container">
        <div id="timerBox" class="timer-overlay">計測中: 10</div>
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="output_canvas"></canvas>
        <div class="guide-msg" id="guideMsg">
            <div class="guide-inner" id="guideText">足元まで画面に入れてください</div>
        </div>
        <div class="status-bar" id="statusBar">AIスタンバイ... 足元を映してください</div>
    </div>

    <div class="result-grid">
        <div class="result-item"><span class="res-label">肩幅</span><span class="res-val"><span id="val-sh">--</span><span class="unit">cm</span></span></div>
        <div class="result-item"><span class="res-label">ウエスト(周)</span><span class="res-val"><span id="val-waist">--</span><span class="unit">cm</span></span></div>
        <div class="result-item"><span class="res-label">袖丈</span><span class="res-val"><span id="val-sl">--</span><span class="unit">cm</span></span></div>
        <div class="result-item"><span class="res-label">股下(正確)</span><span class="res-val"><span id="val-in">--</span><span class="unit">cm</span></span></div>
    </div>

    <button id="mainBtn" class="btn-main" onclick="runSequence()">採寸開始 (正面・側面 各10秒)</button>

    <div id="catalog-section">
        <div style="background:#e0f2fe; padding:10px; border-radius:8px; margin-bottom:10px; font-size:0.75rem;">
            <b>AI選定結果:</b> 立体データに基づき最適なサイズをマークしました。
        </div>
        <div id="dynamic-catalog"></div>
        <button class="btn-main" style="background:#3b82f6; margin-top:10px;" onclick="copyResult()">結果をコピーして終了</button>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    let isMeasuring = false;
    let currentPhase = 'wait'; // wait, front, side
    let liveData = { sh:0, w_width:0, w_depth:0, sl:0, inseam:0 };
    let captured = { front: {}, side: {} };

    // サイズ表（前回の資料を引用）
    const TABLES = {
        j_black: [{s:"S",w:46},{s:"M",w:47.5},{s:"L",w:49},{s:"LL",w:50.5},{s:"3L",w:52},{s:"4L",w:53.5},{s:"5L",w:55}],
        j_navy: [{s:"S",w:49},{s:"M",w:50.5},{s:"L",w:52},{s:"LL",w:53.5},{s:"3L",w:55},{s:"4L",w:56.5},{s:"5L",w:58}],
        p_std: ["70","73","76","79","82","85","88","91","95","100","105","110","115","120"],
        p_navy: [{d:"W59",r:72},{d:"W61",r:74},{d:"W64",r:77},{d:"W67",r:80},{d:"W70",r:83},{d:"W73",r:86},{d:"W76",r:89},{d:"W81",r:94}]
    };

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);

            // 【精度向上】地面の推定：足首やつま先のうち、より低い座標を地面とする
            const groundY = Math.max(lm[27].y, lm[28].y, lm[29].y, lm[30].y);
            const headY = lm[0].y;
            const pixelHeight = Math.abs(groundY - headY);
            
            // 足元が切れているか判定
            if (groundY > 0.98) {
                document.getElementById('statusBar').innerText = "⚠️ 足元が切れています！もっと離れてください";
                document.getElementById('statusBar').style.color = "#ff4757";
            } else {
                document.getElementById('statusBar').innerText = "● 解析中: 全身が正しく映っています";
                document.getElementById('statusBar').style.color = "#0f0";
            }

            const cmPx = h / (pixelHeight * 1.15); // 身長とピクセルの比率

            // リアルタイム計算
            liveData.sh = Math.abs(lm[11].x - lm[12].x) * canvasElement.width * cmPx * 1.35;
            liveData.w_width = Math.abs(lm[23].x - lm[24].x) * canvasElement.width * cmPx * 1.8;
            liveData.sl = Math.sqrt(Math.pow(lm[11].x-lm[15].x,2)+Math.pow(lm[11].y-lm[15].y,2)) * canvasElement.width * cmPx;
            
            // 【股下の正確な算出】股関節の中点から、足首ではなく「地面推定値」までを測る
            const hipCenterY = (lm[23].y + lm[24].y) / 2;
            liveData.inseam = Math.abs(groundY - hipCenterY) * canvasElement.height * cmPx * 1.05;

            // 側面用の厚み（肩のZ軸的広がりをX軸で代用）
            liveData.w_depth = Math.abs(lm[11].x - lm[12].x) * canvasElement.width * cmPx * 4.2;

            // 画面反映
            if (!isMeasuring || currentPhase === 'front') {
                document.getElementById('val-sh').innerText = liveData.sh.toFixed(1);
                document.getElementById('val-sl').innerText = liveData.sl.toFixed(1);
                document.getElementById('val-in').innerText = liveData.inseam.toFixed(1);
                // 正面時はウエスト幅のみで暫定表示
                document.getElementById('val-waist').innerText = (liveData.w_width * 1.6).toFixed(1);
            }
        }
        canvasCtx.restore();
    }

    async function runSequence() {
        isMeasuring = true;
        document.getElementById('mainBtn').disabled = true;
        document.getElementById('timerBox').style.display = "block";

        // PHASE 1: 正面
        currentPhase = 'front';
        document.getElementById('guideText').innerHTML = "【正面】<br>まっすぐ立ち、10秒キープしてください";
        await countdown(10);
        captured.front = JSON.parse(JSON.stringify(liveData));

        // PHASE 2: 側面
        currentPhase = 'side';
        document.getElementById('guideText').innerHTML = "【側面】<br>右側に90度回転してください";
        speechSynthesis.speak(new SpeechSynthesisUtterance("右に回ってください"));
        await countdown(10);
        captured.side = JSON.parse(JSON.stringify(liveData));

        finishAll();
    }

    function countdown(sec) {
        return new Promise(resolve => {
            let c = sec;
            const timer = setInterval(() => {
                document.getElementById('timerBox').innerText = `計測中: ${c}`;
                if (c <= 3) speechSynthesis.speak(new SpeechSynthesisUtterance(c));
                if (c <= 0) { clearInterval(timer); resolve(); }
                c--;
            }, 1000);
        });
    }

    function finishAll() {
        isMeasuring = false;
        // 最終ウエスト計算 (楕円近似)
        const a = captured.front.w_width / 2;
        const b = captured.side.w_depth / 2;
        const h_val = Math.pow(a-b,2)/Math.pow(a+b,2);
        const finalWaist = (Math.PI * (a+b) * (1 + (3*h_val)/(10 + Math.sqrt(4-3*h_val)))).toFixed(1);

        document.getElementById('val-waist').innerText = finalWaist;
        document.getElementById('val-in').innerText = captured.front.inseam.toFixed(1);
        
        document.getElementById('canvas-container').style.display = "none";
        document.getElementById('mainBtn').style.display = "none";
        document.getElementById('catalog-section').style.display = "block";
        
        renderCatalog(finalWaist, captured.front.sh);
    }

    function renderCatalog(waist, shoulder) {
        const dept = document.getElementById('deptInput').value;
        const isNavy = ["大道具", "背景"].includes(dept);
        const container = document.getElementById('dynamic-catalog');
        
        // 上着判定
        let jRec = "";
        const jTable = isNavy ? TABLES.j_navy : TABLES.j_black;
        for(let i of jTable) if(shoulder >= i.w - 1) jRec = i.s;

        // ズボン判定
        let pRec = "";
        if(isNavy) {
            for(let i of TABLES.p_navy) if(waist >= i.r - 2) pRec = i.d;
        } else {
            for(let i of TABLES.p_std) if(waist >= parseInt(i) - 2) pRec = "W"+i;
        }

        container.innerHTML = `
            <div class="item-card">
                <div style="font-weight:bold; font-size:0.8rem; margin-bottom:5px;">${isNavy?'上着(紺)':'上着(黒)'}</div>
                <div class="opt-wrap">
                    ${jTable.map(i => `<button class="opt-btn ${i.s===jRec?'ai-rec':''}" onclick="sel(this,'上着','${i.s}')">${i.s}</button>`).join('')}
                </div>
            </div>
            <div class="item-card">
                <div style="font-weight:bold; font-size:0.8rem; margin-bottom:5px;">${isNavy?'ズボン(紺)':'ズボン(黒)'}</div>
                <div class="opt-wrap">
                    ${(isNavy?TABLES.p_navy.map(i=>i.d):TABLES.p_std.map(i=>"W"+i)).map(val => `<button class="opt-btn ${val===pRec?'ai-rec':''}" onclick="sel(this,'ズボン','${val}')">${val}</button>`).join('')}
                </div>
            </div>
        `;
    }

    function sel(btn, cat, val) {
        btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => { await pose.send({image: videoElement}); },
        width: 640, height: 480
    });
    camera.start();

    function updateUI() { /* 必要に応じて初期化 */ }
</script>
</body>
</html>
