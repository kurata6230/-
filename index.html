<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI採寸＆備品DXポータル</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 550px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 1.1rem; color: #1e293b; margin: 0 0 15px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }
        
        /* 入力エリア（最優先表示） */
        .input-row { display: flex; gap: 10px; margin-bottom: 15px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .input-group { flex: 1; }
        label { display: block; font-size: 0.7rem; font-weight: bold; color: #64748b; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }

        /* カメラエリア */
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 15px; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }

        /* 4大部位表示 */
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .result-item { background: #f1f5f9; padding: 8px; border-radius: 8px; text-align: center; border: 1px solid #e2e8f0; }
        .res-label { font-size: 0.65rem; color: #64748b; display: block; }
        .res-val { font-size: 1rem; font-weight: bold; color: #2563eb; }

        /* カタログセクション */
        #catalog-section { display: none; border-top: 2px dashed #cbd5e1; padding-top: 15px; width: 100%; }
        .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3b82f6; margin-bottom: 10px; box-sizing: border-box; font-size: 0.9rem; }
        .tab-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .tab { white-space: nowrap; padding: 8px 16px; background: #e2e8f0; border-radius: 20px; font-size: 0.8rem; cursor: pointer; border: none; font-weight: bold; color: #475569; }
        .tab.active { background: #3b82f6; color: white; }

        .item-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 12px; background: #fff; }
        .item-card.hidden { display: none; }
        .item-name { font-weight: bold; font-size: 0.95rem; color: #1e293b; margin-bottom: 10px; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 8px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; margin-right: 4px; margin-bottom: 4px; }
        .opt-btn.selected { background: #3b82f6; color: white; border-color: #3b82f6; }
        .ai-rec { border: 2px solid #10b981 !important; position: relative; }
        .ai-rec::after { content: "推奨"; position: absolute; top: -12px; right: -5px; background: #10b981; color: white; font-size: 0.5rem; padding: 1px 4px; border-radius: 4px; }

        .action-btn { width: 100%; padding: 18px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-measure { background: #10b981; color: white; }
        .btn-order { background: #3b82f6; color: white; }
        textarea { width: 100%; height: 250px; padding: 12px; border-radius: 8px; border: 1px solid #3b82f6; font-size: 0.8rem; background: #f8fafc; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <h1>AI採寸＆備品DX統合ポータル</h1>
    
    <!-- 入力エリア（復活） -->
    <div class="input-row">
        <div class="input-group">
            <label>身長(cm)</label>
            <input type="number" id="heightInput" value="170">
        </div>
        <div class="input-group">
            <label>靴サイズ(cm)</label>
            <input type="number" id="footInput" value="26.5" step="0.5">
        </div>
    </div>

    <div id="canvas-container">
        <video id="input_video"></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- 4大部位表示 -->
    <div class="result-grid">
        <div class="result-item"><span class="res-label">肩幅</span><span class="res-val" id="shW">--</span></div>
        <div class="result-item"><span class="res-label">ウエスト</span><span class="res-val" id="waist">--</span></div>
        <div class="result-item"><span class="res-label">袖丈</span><span class="res-val" id="slL">--</span></div>
        <div class="result-item"><span class="res-label">股下</span><span class="res-val" id="inL">--</span></div>
    </div>

    <button id="mainBtn" class="action-btn btn-measure" onclick="startSelfTimer()">採寸スタート (10秒)</button>

    <!-- カタログ・検索セクション -->
    <div id="catalog-section">
        <div style="background:#eff6ff; padding:10px; border-radius:8px; margin-bottom:15px; font-weight:bold; font-size:0.85rem; display:flex; justify-content:space-between; border:1px solid #3b82f6;">
            <span>保有: 300 pt</span>
            <span id="used-pts" style="color:#2563eb;">利用合計: 0 pt</span>
        </div>

        <input type="text" class="search-box" id="searchInput" placeholder="数百種類のアイテムから検索..." oninput="filterItems()">
        
        <div class="tab-bar">
            <button class="tab active" onclick="setTab(this, 'すべて')">すべて</button>
            <button class="tab" onclick="setTab(this, '被服')">被服</button>
            <button class="tab" onclick="setTab(this, '劇団・舞台')">劇団・舞台</button>
            <button class="tab" onclick="setTab(this, '安全・保護具')">安全・保護具</button>
        </div>

        <div id="itemList">
            <!-- サンプルアイテム -->
            <div class="item-card" data-cat="被服" data-name="速乾Tシャツ">
                <div class="item-name">👕 速乾ドライTシャツ (20pt)</div>
                <div class="select-area">
                    <button class="opt-btn" id="rec-t-M" onclick="sel(this,'Tシャツ','M',20)">M</button>
                    <button class="opt-btn" id="rec-t-L" onclick="sel(this,'Tシャツ','L',20)">L</button>
                    <button class="opt-btn" id="rec-t-LL" onclick="sel(this,'Tシャツ','LL',20)">LL</button>
                </div>
            </div>

            <div class="item-card" data-cat="劇団・舞台" data-name="稽古着">
                <div class="item-name">🥋 稽古用和装インナー (30pt)</div>
                <div class="select-area">
                    <button class="opt-btn" id="rec-k-M" onclick="sel(this,'稽古着','M',30)">M</button>
                    <button class="opt-btn" id="rec-k-L" onclick="sel(this,'稽古着','L',30)">L</button>
                </div>
            </div>

            <div class="item-card" data-cat="安全・保護具" data-name="安全靴">
                <div class="item-name">👞 作業用安全靴 (40pt)</div>
                <div class="select-area"><button class="opt-btn" onclick="sel(this,'安全靴','26.0',40)">26.0</button><button class="opt-btn" onclick="sel(this,'安全靴','27.0',40)">27.0</button></div>
            </div>
        </div>

        <button class="action-btn btn-order" onclick="finishOrder()">申請内容を確定してコピー</button>
    </div>

    <div id="copyArea" style="display:none; margin-top:20px; width:100%;">
        <textarea id="resultText" readonly></textarea>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    let measurements = { shoulder:0, waist:0, sleeve:0, inseam:0, topSize:"M" };
    let selections = {}; 
    let currentTab = "すべて";

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);
            const bodyPx = Math.abs(lm[27].y - lm[0].y); 
            const ratio = h / (bodyPx * 1.18); 
            if (bodyPx > 0) {
                measurements.shoulder = Math.sqrt(Math.pow(lm[11].x-lm[12].x, 2)+Math.pow(lm[11].y-lm[12].y, 2)) * canvasElement.width * ratio;
                measurements.waist = Math.abs(lm[23].x - lm[24].x) * canvasElement.width * ratio * 2.4;
                measurements.sleeve = Math.sqrt(Math.pow(lm[11].x-lm[15].x, 2)+Math.pow(lm[11].y-lm[15].y, 2)) * canvasElement.width * ratio;
                measurements.inseam = Math.abs(lm[23].y - lm[27].y) * canvasElement.height * ratio;

                document.getElementById('shW').innerText = measurements.shoulder.toFixed(1);
                document.getElementById('waist').innerText = measurements.waist.toFixed(0);
                document.getElementById('slL').innerText = measurements.sleeve.toFixed(1);
                document.getElementById('inL').innerText = measurements.inseam.toFixed(1);

                measurements.topSize = (measurements.shoulder > 44) ? "L" : "M";
            }
        }
        canvasCtx.restore();
    }

    function setTab(btn, tabName) {
        currentTab = tabName;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        filterItems();
    }

    function filterItems() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.item-card').forEach(card => {
            const cat = card.getAttribute('data-cat');
            const name = card.getAttribute('data-name').toLowerCase();
            const matchTab = (currentTab === "すべて" || cat === currentTab);
            const matchSearch = name.includes(searchText);
            card.classList.toggle('hidden', !(matchTab && matchSearch));
        });
    }

    function startSelfTimer() {
        let count = 10;
        document.getElementById('mainBtn').disabled = true;
        const timer = setInterval(() => {
            document.getElementById('mainBtn').innerText = `あと ${count} 秒...`;
            if (count <= 3 && count > 0) speechSynthesis.speak(new SpeechSynthesisUtterance(count));
            if (count <= 0) {
                clearInterval(timer);
                document.getElementById('mainBtn').style.display = "none";
                document.getElementById('catalog-section').style.display = "block";
                const rec = measurements.topSize;
                ["rec-t-","rec-k-"].forEach(id => {
                    const el = document.getElementById(id + rec);
                    if(el) el.classList.add('ai-rec');
                });
                speechSynthesis.speak(new SpeechSynthesisUtterance("計測完了。アイテムを選んでください"));
            }
            count--;
        }, 1000);
    }

    function sel(btn, item, val, pt) {
        const parent = btn.parentElement;
        parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selections[item] = {val: val, pts: pt};
        let total = 0;
        for (let k in selections) total += selections[k].pts;
        document.getElementById('used-pts').innerText = `利用合計: ${total} pt`;
    }

    function finishOrder() {
        let res = `【統合申請ポータル】\nAIサイズ判定: ${measurements.topSize}\n靴サイズ: ${document.getElementById('footInput').value}cm\n\n選択内容:\n`;
        for (let k in selections) res += `・${k}: ${selections[k].val} (${selections[k].pts}pt)\n`;
        document.getElementById('resultText').value = res;
        document.getElementById('catalog-section').style.display = "none";
        document.getElementById('copyArea').style.display = "block";
        navigator.clipboard.writeText(res);
        alert("コピーしました。");
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);
    new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480 }).start();
</script>
</body>
</html>
