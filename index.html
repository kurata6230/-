<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝塚舞台：2026年度 採寸ポータル【最終版】</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 550px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 1rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        
        /* 入力フォーム（全項目） */
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.6rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
        input, select { width: 100%; padding: 8px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }

        /* カメラとガイド */
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 10px; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        .flip-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 0.65rem; cursor: pointer; z-index: 100; }
        
        .status-bar { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.6); color: #0f0; font-size: 0.7rem; padding: 4px; text-align: center; font-family: monospace; }

        /* 4大部位表示（小数点1位） */
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 12px; }
        .result-item { background: #f1f5f9; padding: 6px; border-radius: 6px; text-align: center; border: 1px solid #e2e8f0; }
        .res-label { font-size: 0.5rem; color: #64748b; display: block; }
        .res-val { font-size: 0.85rem; font-weight: bold; color: #2563eb; }

        /* アドバイス */
        .advice-box { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; padding: 8px; border-radius: 8px; font-size: 0.75rem; margin-bottom: 10px; display: none; }

        /* カタログ */
        #catalog-section { display: none; border-top: 2px dashed #cbd5e1; padding-top: 15px; width: 100%; }
        .item-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
        .item-name { font-weight: bold; font-size: 0.85rem; color: #1e293b; margin-bottom: 8px; border-left: 4px solid #3b82f6; padding-left: 8px; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 7px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; margin-right: 3px; margin-bottom: 3px; min-width: 40px; }
        .opt-btn.selected { background: #3b82f6; color: white; }
        .ai-rec { border: 2px solid #10b981 !important; position: relative; }
        .ai-rec::after { content: "推奨"; position: absolute; top: -11px; right: -5px; background: #10b981; color: white; font-size: 0.5rem; padding: 1px 3px; border-radius: 3px; z-index: 10; }

        .action-btn { width: 100%; padding: 18px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-measure { background: #10b981; color: white; }
        .btn-order { background: #3b82f6; color: white; }
        textarea { width: 100%; height: 250px; padding: 10px; border-radius: 8px; border: 1px solid #3b82f6; font-size: 0.75rem; background: #f8fafc; margin-top: 15px; line-height: 1.4; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：2026年度 採寸ポータル</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>性別</label>
            <select id="genderInput" onchange="updateView()">
                <option value="女">女性</option><option value="男">男性</option>
            </select>
        </div>
        <div class="input-group"><label>配属部署</label>
            <select id="deptInput" onchange="updateView()">
                <option value="大道具">大道具</option><option value="衣裳">衣裳</option>
                <option value="進行">進行</option><option value="照明">照明</option>
                <option value="制作">制作</option><option value="背景">背景</option>
            </select>
        </div>
        <div class="input-group"><label>利き手</label>
            <select id="handInput"><option value="右">右</option><option value="左">左</option></select>
        </div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="160"></div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="23.5"></div>
    </div>

    <div id="canvas-container">
        <button class="flip-btn" onclick="toggleCamera()">📷 カメラ切替</button>
        <video id="input_video"></video>
        <canvas id="output_canvas"></canvas>
        <div class="status-bar" id="aiStatus">AIシステム準備中...</div>
    </div>

    <div class="result-grid">
        <div class="result-item"><span class="res-label">肩幅</span><span class="res-val" id="shW">--</span></div>
        <div class="result-item"><span class="res-label">ウエスト</span><span class="res-val" id="waist">--</span></div>
        <div class="result-item"><span class="res-label">袖丈</span><span class="res-val" id="slL">--</span></div>
        <div class="result-item"><span class="res-label">股下</span><span class="res-val" id="inL">--</span></div>
    </div>

    <div class="advice-box" id="adviceBox"></div>

    <button id="mainBtn" class="action-btn btn-measure" onclick="startSelfTimer()">採寸スタート (10秒)</button>

    <div id="catalog-section">
        <!-- 備品エリア -->
        <div class="item-card">
            <div class="item-name">黒上着 / シャツ / ベスト</div>
            <div class="select-area">
                <button class="opt-btn" id="rec-u-S" onclick="sel(this,'上着','S')">S</button>
                <button class="opt-btn" id="rec-u-M" onclick="sel(this,'上着','M')">M</button>
                <button class="opt-btn" id="rec-u-L" onclick="sel(this,'上着','L')">L</button>
                <button class="opt-btn" id="rec-u-2L" onclick="sel(this,'上着','2L')">2L</button>
            </div>
        </div>

        <div class="item-card" id="card-pants">
            <div class="item-name">黒ズボン (W73-W120)</div>
            <div class="select-area">
                <button class="opt-btn" id="rec-p-W76" onclick="sel(this,'ズボン','W76')">W76</button>
                <button class="opt-btn" id="rec-p-W79" onclick="sel(this,'ズボン','W79')">W79</button>
                <button class="opt-btn" id="rec-p-W82" onclick="sel(this,'ズボン','W82')">W82</button>
                <button class="opt-btn" id="rec-p-W85" onclick="sel(this,'ズボン','W85')">W85</button>
            </div>
        </div>

        <div class="item-card" id="card-slim" style="display:none; background:#fffcf0;">
            <div class="item-name">女性用 スリムズボン (7号-11号)</div>
            <div class="select-area">
                <button class="opt-btn" id="rec-s-7" onclick="sel(this,'スリムズボン','7号')">7号</button>
                <button class="opt-btn" id="rec-s-9" onclick="sel(this,'スリムズボン','9号')">9号</button>
                <button class="opt-btn" id="rec-s-11" onclick="sel(this,'スリムズボン','11号')">11号</button>
            </div>
        </div>

        <div class="item-card" id="card-isho" style="display:none; background:#f0f9ff;">
            <div class="item-name">衣裳係専用：黒総ゴムパンツ</div>
            <div class="select-area">
                <button class="opt-btn" id="rec-g-S" onclick="sel(this,'総ゴム','S')">S</button>
                <button class="opt-btn" id="rec-g-M" onclick="sel(this,'総ゴム','M')">M</button>
                <button class="opt-btn" id="rec-g-L" onclick="sel(this,'総ゴム','L')">L</button>
            </div>
        </div>

        <div class="item-card">
            <div class="item-name">その他備品</div>
            <div class="select-area">
                <button class="opt-btn" onclick="sel(this,'ヘルメット','一般')">ヘルメット一般</button>
                <button class="opt-btn" onclick="sel(this,'靴下','黒5足組')">黒靴下</button>
                <button class="opt-btn" onclick="sel(this,'中敷き','インソール')">インソール</button>
            </div>
        </div>

        <button class="action-btn btn-order" onclick="finishOrder()">内容を確定してコピー</button>
    </div>

    <textarea id="resultText" style="display:none;"></textarea>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const mainBtn = document.getElementById('mainBtn');
    const statusEl = document.getElementById('aiStatus');
    
    let measurements = { shoulder:0, waist:0, sleeve:0, inseam:0 };
    let selections = {};
    let isUserCamera = true;
    let cameraInstance = null;

    function onResults(results) {
        statusEl.innerText = results.poseLandmarks ? "● AI検知中: そのまま静止してください" : "○ 準備完了: カメラに全身を映してください";
        
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);
            
            // 【改善】足元が見えない場合も腰の位置(23,24)から比率を割り出す
            const nose = lm[0];
            const ankle = (lm[27].visibility > 0.5) ? lm[27] : lm[23];
            const bodyPx = Math.abs(ankle.y - nose.y);
            const ratio = (ankle === lm[27]) ? h / (bodyPx * 1.18) : h / (bodyPx * 2.2);

            // 11112cmなどの異常値を防ぐガード（ratioが極端な場合は無視）
            if (ratio > 0.1 && ratio < 15.0) {
                measurements.shoulder = (Math.sqrt(Math.pow(lm[11].x-lm[12].x, 2)+Math.pow(lm[11].y-lm[12].y, 2)) * canvasElement.width * ratio).toFixed(1);
                measurements.waist = (Math.abs(lm[23].x - lm[24].x) * canvasElement.width * ratio * 2.4).toFixed(1);
                measurements.sleeve = (Math.sqrt(Math.pow(lm[11].x-lm[15].x, 2)+Math.pow(lm[11].y-lm[15].y, 2)) * canvasElement.width * ratio).toFixed(1);
                measurements.inseam = (Math.abs(lm[23].y - lm[27].y) * canvasElement.height * ratio).toFixed(1);

                document.getElementById('shW').innerText = measurements.shoulder + "cm";
                document.getElementById('waist').innerText = measurements.waist + "cm";
                document.getElementById('slL').innerText = measurements.sleeve + "cm";
                document.getElementById('inL').innerText = measurements.inseam + "cm";
            }
        }
        canvasCtx.restore();
    }

    async function toggleCamera() {
        isUserCamera = !isUserCamera;
        if (cameraInstance) { await cameraInstance.stop(); startCamera(); }
    }

    function startCamera() {
        cameraInstance = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 640, height: 480, facingMode: isUserCamera ? 'user' : 'environment'
        });
        cameraInstance.start();
    }

    function startSelfTimer() {
        let count = 10; mainBtn.disabled = true;
        const timer = setInterval(() => {
            mainBtn.innerText = `確定まで ${count} 秒...`;
            if (count <= 3 && count > 0) window.speechSynthesis.speak(new SpeechSynthesisUtterance(count));
            if (count <= 0) {
                clearInterval(timer);
                mainBtn.style.display = "none";
                document.getElementById('catalog-section').style.display = "block";
                recommend();
            }
            count--;
        }, 1000);
    }

    function recommend() {
        const sh = parseFloat(measurements.shoulder); const ws = parseFloat(measurements.waist);
        const uRec = (sh > 47) ? "2L" : (sh > 44) ? "L" : (sh > 41) ? "M" : "S";
        const uBtn = document.getElementById("rec-u-" + uRec); if(uBtn) uBtn.classList.add('ai-rec');
        const pRec = (ws > 82) ? "W85" : (ws > 79) ? "W82" : (ws > 76) ? "W79" : (ws > 73) ? "W76";
        const pBtn = document.getElementById("rec-p-" + pRec); if(pBtn) pBtn.classList.add('ai-rec');
    }

    function sel(btn, item, val) {
        const parent = btn.parentElement; parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected'); selections[item] = val;
    }

    function finishOrder() {
        const res = `【採寸報告】\n氏名:${document.getElementById('nameInput').value}\n肩幅:${measurements.shoulder}cm / 腰:${measurements.waist}cm\n`;
        let items = ""; for (let k in selections) items += `・${k}: ${selections[k]}\n`;
        const resText = document.getElementById('resultText'); resText.value = res + items; resText.style.display = "block";
        navigator.clipboard.writeText(res + items).then(() => alert("結果をコピーしました。"));
    }

    function updateView() {
        document.getElementById('card-slim').style.display = (document.getElementById('genderInput').value === "女") ? "block" : "none";
        document.getElementById('card-isho').style.display = (document.getElementById('deptInput').value === "衣裳") ? "block" : "none";
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);
    startCamera();
    updateView();
</script>
</body>
</html>
