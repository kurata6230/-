<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI採寸ツール：上下別判定モデル</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { display: block; font-size: 0.75rem; font-weight: bold; color: #64748b; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }

        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .result-item { background: #f8fafc; padding: 8px; border-radius: 8px; text-align: center; font-size: 0.85rem; border: 1px solid #e2e8f0; }
        .val { font-weight: bold; color: #1e293b; }

        .size-display { grid-column: 1 / 3; display: flex; gap: 8px; margin-top: 5px; }
        .size-box { flex: 1; background: #2563eb; color: white; padding: 12px; border-radius: 8px; text-align: center; }
        .size-box.pants { background: #475569; }
        .size-label { font-size: 0.7rem; opacity: 0.9; margin-bottom: 4px; }
        .size-val { font-size: 1.4rem; font-weight: bold; }

        .action-btn { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-top: 15px; cursor: pointer; }
        #copyArea { margin-top: 15px; display: none; width: 100%; }
        textarea { width: 100%; height: 140px; padding: 10px; border-radius: 8px; border: 1px solid #3b82f6; background: #eff6ff; font-size: 0.85rem; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="font-size:1.2rem; text-align:center; margin-bottom:15px;">AI作業着採寸（上下セット版）</h1>
    
    <div class="input-row">
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="170"></div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="footInput" value="26.5" step="0.5"></div>
    </div>

    <div id="canvas-container">
        <video id="input_video"></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="result-grid">
        <div class="result-item">肩幅: <span class="val" id="shW">--</span>cm</div>
        <div class="result-item">袖丈: <span class="val" id="slL">--</span>cm</div>
        <div class="result-item">ウエスト(推): <span class="val" id="waist">--</span>cm</div>
        <div class="result-item">股下: <span class="val" id="inL">--</span>cm</div>
        
        <div class="size-display">
            <div class="size-box">
                <div class="size-label">上着サイズ</div>
                <div class="size-val" id="topSize">--</div>
            </div>
            <div class="size-box pants">
                <div class="size-label">ズボンサイズ</div>
                <div class="size-val" id="pantsSize">--</div>
            </div>
        </div>
    </div>

    <button id="mainBtn" class="action-btn" onclick="startSelfTimer()">採寸スタート (10秒後に確定)</button>

    <div id="copyArea">
        <p style="font-size:0.8rem; color:#2563eb; font-weight:bold; margin-bottom:5px;">▼以下の内容をコピーしました</p>
        <textarea id="resultText" readonly></textarea>
        <button class="action-btn" style="background:#3b82f6;" onclick="goToForms()">Microsoft Formsを開く</button>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const mainBtn = document.getElementById('mainBtn');
    const copyArea = document.getElementById('copyArea');
    const resultTextArea = document.getElementById('resultText');
    
    let measurements = { shoulder: 0, sleeve: 0, waist: 0, inseam: 0, topSize: "", pantsSize: "" };
    let isCounting = false;

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);
            const bodyPx = Math.abs(lm[27].y - lm[0].y); // 鼻から足首
            const ratio = h / (bodyPx * 1.18); 

            if (bodyPx > 0) {
                measurements.shoulder = Math.sqrt(Math.pow(lm[11].x-lm[12].x, 2)+Math.pow(lm[11].y-lm[12].y, 2)) * canvasElement.width * ratio;
                measurements.sleeve = Math.sqrt(Math.pow(lm[11].x-lm[15].x, 2)+Math.pow(lm[11].y-lm[15].y, 2)) * canvasElement.width * ratio;
                measurements.waist = Math.abs(lm[23].x - lm[24].x) * canvasElement.width * ratio * 2.4; // 正面幅×2.4(一周＋厚み)
                measurements.inseam = Math.abs(lm[23].y - lm[27].y) * canvasElement.height * ratio;

                document.getElementById('shW').innerText = measurements.shoulder.toFixed(1);
                document.getElementById('slL').innerText = measurements.sleeve.toFixed(1);
                document.getElementById('waist').innerText = measurements.waist.toFixed(0);
                document.getElementById('inL').innerText = measurements.inseam.toFixed(1);

                calculateSizes(measurements.shoulder, measurements.waist);
            }
        }
        canvasCtx.restore();
    }

    function calculateSizes(sh, ws) {
        // 上着判定 (肩幅基準)
        if (sh > 52) measurements.topSize = "3L";
        else if (sh > 48) measurements.topSize = "LL";
        else if (sh > 44) measurements.topSize = "L";
        else if (sh > 40) measurements.topSize = "M";
        else measurements.topSize = "S";

        // ズボン判定 (ウエスト基準)
        if (ws > 95) measurements.pantsSize = "3L(95-100)";
        else if (ws > 88) measurements.pantsSize = "LL(88-91)";
        else if (ws > 82) measurements.pantsSize = "L(82-85)";
        else if (ws > 76) measurements.pantsSize = "M(76-79)";
        else measurements.pantsSize = "S(70-73)";

        document.getElementById('topSize').innerText = measurements.topSize;
        document.getElementById('pantsSize').innerText = measurements.pantsSize;
    }

    function startSelfTimer() {
        if (isCounting) return;
        isCounting = true;
        copyArea.style.display = "none";
        let count = 10;
        const timer = setInterval(() => {
            mainBtn.innerText = `あと ${count} 秒で確定...`;
            if (count <= 5 && count > 0) {
                const uttr = new SpeechSynthesisUtterance(count.toString());
                window.speechSynthesis.speak(uttr);
            }
            if (count <= 0) {
                clearInterval(timer);
                finishMeasurement();
            }
            count--;
        }, 1000);
    }

    function finishMeasurement() {
        const footSize = document.getElementById('footInput').value;
        const res = `【採寸報告】\n■推奨サイズ\n上着: ${measurements.topSize}\nズボン: ${measurements.pantsSize}\n靴: ${footSize}cm\n\n■詳細データ\n肩幅: ${measurements.shoulder.toFixed(1)}cm\nウエスト(推): ${measurements.waist.toFixed(0)}cm\n袖丈: ${measurements.sleeve.toFixed(1)}cm\n股下: ${measurements.inseam.toFixed(1)}cm`;
        
        resultTextArea.value = res;
        copyArea.style.display = "block";
        navigator.clipboard.writeText(res).then(() => {
            const finalUttr = new SpeechSynthesisUtterance("計測完了。コピーしました。");
            window.speechSynthesis.speak(finalUttr);
            alert("計測完了！結果をコピーしました。");
        });
        isCounting = false;
        mainBtn.innerText = "再計測する";
    }

    function goToForms() {
        window.location.href = "https://forms.office.com/r/XXXXXX";
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);
    new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480 }).start();
</script>
</body>
</html>
