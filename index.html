<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝塚舞台：精密3D採寸DX（音声ガイド付）</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 0.9rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        .input-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.55rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
        input, select { width: 100%; padding: 6px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 12px; border: 2px solid #3b82f6; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        .flip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 0.7rem; z-index: 110; cursor: pointer; }
        .timer-overlay { position: absolute; top: 15px; left: 15px; background: rgba(239, 68, 68, 0.9); color: white; padding: 8px 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; display: none; z-index: 100; }
        .guide-msg { position: absolute; top: 50%; width: 100%; text-align: center; color: white; pointer-events: none; transform: translateY(-50%); }
        .guide-inner { background: rgba(0,0,0,0.7); display: inline-block; padding: 12px 20px; border-radius: 10px; font-size: 0.85rem; border: 1px solid #3b82f6; line-height: 1.4; }
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .result-item { background: #fff; padding: 10px 4px; border-radius: 8px; text-align: center; border: 2px solid #e2e8f0; }
        .result-item.fixed { border-color: #10b981; background: #f0fdf4; }
        .res-val { font-size: 0.85rem; font-weight: bold; color: #1e293b; display: block; }
        .res-label { font-size: 0.55rem; color: #64748b; font-weight: bold; }
        .btn-main { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        #catalog-section { display: none; width: 100%; margin-top: 15px; border-top: 2px dashed #cbd5e1; padding-top: 15px; }
        .item-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fff; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 6px; border-radius: 5px; font-size: 0.65rem; min-width: 45px; text-align: center; }
        .selected { background: #3b82f6 !important; color: white; }
        .ai-rec { outline: 3px solid #10b981; background: #f0fdf4 !important; position: relative; }
        .ai-rec::after { content: "AI推奨"; position: absolute; top: -12px; right: -5px; background: #10b981; color: white; font-size: 0.5rem; padding: 1px 4px; border-radius: 3px; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：精密3D採寸＆製品照合</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="165"></div>
        <div class="input-group"><label>性別</label><select id="genderInput" onchange="resetCatalog()"><option value="男">男性</option><option value="女">女性</option></select></div>
        <div class="input-group"><label>部署</label>
            <select id="deptInput" onchange="resetCatalog()">
                <option value="大道具">大道具係</option><option value="小道具">小道具係</option><option value="衣裳">衣裳係</option><option value="照明">照明係</option>
                <option value="音響">音響係</option><option value="進行">進行係</option><option value="背景">背景係</option><option value="電飾">電飾係</option>
                <option value="装置">装置係</option><option value="舞台幕">舞台幕係</option><option value="公演管理">公演管理</option>
            </select>
        </div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="25.0" step="0.5"></div>
        <div class="input-group"><label>利き手</label><select id="handInput"><option value="右">右</option><option value="左">左</option></select></div>
    </div>

    <div id="canvas-container">
        <button class="flip-btn" onclick="toggleCamera()">📷 カメラ切替</button>
        <div id="timerBox" class="timer-overlay">準備中</div>
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="output_canvas"></canvas>
        <div class="guide-msg" id="guideMsg"><div class="guide-inner" id="guideText">足元まで画面に入れてください</div></div>
    </div>

    <div class="result-grid">
        <div class="result-item"><span class="res-val" id="val-sh">-- cm</span><span class="res-label">肩幅</span></div>
        <div class="result-item"><span class="res-val" id="val-waist">-- cm</span><span class="res-label">ウエスト</span></div>
        <div class="result-item"><span class="res-val" id="val-sl">-- cm</span><span class="res-label">袖丈</span></div>
        <div class="result-item"><span class="res-val" id="val-in">-- cm</span><span class="res-label">股下</span></div>
    </div>

    <button id="mainBtn" class="btn-main" onclick="runSequence()">採寸開始 (音声ガイド付)</button>

    <div id="catalog-section"><div id="dynamic-catalog"></div><button class="btn-main" style="background:#3b82f6; margin-top:10px;" onclick="copyResult()">結果をコピー</button></div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    let isFixed = false, isUserCamera = true, cameraInstance = null;
    let liveData = { sh:0, w_w:0, w_d:0, sl:0, ins:0 }, finalData = {};

    const MASTER = {
        jackets: { black: [{s:"S",sh:46.0},{s:"M",sh:47.5},{s:"L",sh:49.0},{s:"LL",sh:50.5},{s:"3L",sh:52.0}], navy: [{s:"S",sh:49.0},{s:"M",sh:50.5},{s:"L",sh:52.0}] },
        pants: { black_std: ["70","73","76","79","82","85","88"], navy_z: [{d:"W59",r:72},{d:"W61",r:74},{d:"W64",r:77}], slim: ["7","9","11"], gomu: ["SS","S","M","L","LL"] }
    };

    function speak(text) { speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0,0,canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0,0,canvasElement.width, canvasElement.height);
        if (results.poseLandmarks && !isFixed) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color:'#00FF00', lineWidth:4});
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);
            const groundY = Math.max(lm[27].y, lm[28].y);
            const headY = lm[0].y;
            const cmPx = h / (Math.abs(groundY - headY) * 1.15);
            liveData.sh = Math.abs(lm[11].x - lm[12].x) * cmPx * 1.35;
            liveData.w_w = Math.abs(lm[23].x - lm[24].x) * cmPx * 1.8;
            liveData.sl = Math.sqrt(Math.pow(lm[11].x-lm[15].x,2)+Math.pow(lm[11].y-lm[15].y,2)) * cmPx;
            liveData.ins = Math.abs(groundY - (lm[23].y + lm[24].y)/2) * cmPx * 1.05;
            liveData.w_d = Math.abs(lm[11].x - lm[12].x) * cmPx * 4.1;
            document.getElementById('val-sh').innerText = liveData.sh.toFixed(1) + " cm";
            document.getElementById('val-sl').innerText = liveData.sl.toFixed(1) + " cm";
            document.getElementById('val-in').innerText = liveData.ins.toFixed(1) + " cm";
            document.getElementById('val-waist').innerText = (liveData.w_w * 1.6).toFixed(1) + " cm";
        }
        canvasCtx.restore();
    }

    async function toggleCamera() { isUserCamera = !isUserCamera; if (cameraInstance) { await cameraInstance.stop(); startCamera(); } }
    function startCamera() { cameraInstance = new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480, facingMode: isUserCamera ? 'user' : 'environment' }); cameraInstance.start(); }

    function countdown(sec, msg) {
        return new Promise(resolve => {
            let count = sec;
            document.getElementById('timerBox').style.display = "block";
            const timer = setInterval(() => {
                document.getElementById('timerBox').innerText = msg + ": " + count;
                if(count <= 3 && count > 0) speak(count.toString());
                if(count <= 0) { clearInterval(timer); resolve(); }
                count--;
            }, 1000);
        });
    }

    async function runSequence() {
        document.getElementById('mainBtn').disabled = true;
        isFixed = false;
        speak("正面の計測を開始します。10秒間、姿勢を良くしてください。");
        document.getElementById('guideText').innerHTML = "【正面計測】<br>姿勢を良くしてください";
        await countdown(10, "正面");
        finalData.sh = liveData.sh; finalData.sl = liveData.sl; finalData.ins = liveData.ins;
        const fw = liveData.w_w;

        speak("正面完了。次は、右に90度回ってください。側面の計測を開始します。");
        document.getElementById('guideText').innerHTML = "【側面計測】<br>右側に90度回転してください";
        await countdown(10, "側面");
        const sd = liveData.w_d;

        const a = fw/2, b = sd/2, hv = Math.pow(a-b,2)/Math.pow(a+b,2);
        finalData.waist = Math.PI * (a+b) * (1 + (3*hv)/(10 + Math.sqrt(4-3*hv)));
        
        isFixed = true;
        speak("計測が完了しました。サイズを確認してください。");
        document.getElementById('timerBox').style.display = "none";
        document.getElementById('canvas-container').style.display = "none";
        document.getElementById('val-waist').innerText = finalData.waist.toFixed(1) + " cm";
        document.querySelectorAll('.result-item').forEach(el => el.classList.add('fixed'));
        document.getElementById('catalog-section').style.display = "block";
        renderCatalog();
    }

    function renderCatalog() {
        const dept = document.getElementById('deptInput').value;
        const gender = document.getElementById('genderInput').value;
        const isNavy = ["大道具", "背景", "装置", "舞台幕"].includes(dept);
        const container = document.getElementById('dynamic-catalog');
        const jTable = isNavy ? MASTER.jackets.navy : MASTER.jackets.black;
        let jRec = jTable[0].s; for(let item of jTable) if(finalData.sh >= item.sh - 0.5) jRec = item.s;
        
        container.innerHTML = `
            <div class="item-card"><div class="item-name">${isNavy?'紺/製作型':'黒/公演型'} 上着</div>
                <div class="opt-wrap">${jTable.map(i=>`<button class="opt-btn ${i.s===jRec?'ai-rec':''}" onclick="sel(this,'上着','${i.s}')">${i.s}</button>`).join('')}</div>
            </div>
            <div class="item-card"><div class="item-name">ズボン / シャツ / その他</div>
                <div class="opt-wrap"><button class="opt-btn ai-rec">推奨サイズを確認</button></div>
            </div>`;
        document.getElementById('mainBtn').disabled = false;
        document.getElementById('mainBtn').innerText = "再計測";
    }

    function sel(btn, cat, val) { btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); }
    function copyResult() { alert("結果をコピーしました"); }
    function resetCatalog() { if(isFixed) renderCatalog(); }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
    pose.onResults(onResults);
    startCamera();
</script>
</body>
</html>
