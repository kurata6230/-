<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI採寸ツール：コピペ対応版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { display: block; font-size: 0.75rem; font-weight: bold; color: #64748b; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .result-item { background: #f1f5f9; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.9rem; }
        .rec-size-card { grid-column: 1 / 3; background: #2563eb; color: white; padding: 10px; border-radius: 8px; text-align: center; }
        .action-btn { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-top: 15px; cursor: pointer; }
        
        /* 追記：コピペ用エリア */
        #copyArea { margin-top: 15px; display: none; }
        textarea { width: 100%; height: 120px; padding: 10px; border-radius: 8px; border: 1px solid #3b82f6; background: #eff6ff; font-size: 0.9rem; box-sizing: border-box; }
        .copy-info { font-size: 0.8rem; color: #2563eb; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="font-size:1.2rem; text-align:center;">AI自動採寸システム</h1>
    
    <div class="input-row">
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="170"></div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="footInput" value="26.5" step="0.5"></div>
    </div>

    <div id="canvas-container">
        <video id="input_video"></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="result-grid">
        <div class="result-item">肩幅: <span id="shW">--</span>cm</div>
        <div class="result-item">身幅: <span id="chW">--</span>cm</div>
        <div class="result-item">袖丈: <span id="slL">--</span>cm</div>
        <div class="result-item">股下: <span id="inL">--</span>cm</div>
        <div class="rec-size-card">推奨サイズ: <span id="finalSize" style="font-size:1.5rem; font-weight:bold;">判定中</span></div>
    </div>

    <button id="mainBtn" class="action-btn" onclick="startSelfTimer()">採寸スタート</button>

    <!-- 追記：コピペ用エリア（完了後に表示） -->
    <div id="copyArea">
        <p class="copy-info">▼以下の内容がコピーされました</p>
        <textarea id="resultText" readonly></textarea>
        <p style="font-size: 0.7rem; color: #666; margin-top: 5px;">※コピーできていない場合は、上記を全選択してコピーしてください。</p>
        <button class="action-btn" style="background:#3b82f6;" onclick="goToForms()">フォームを開く</button>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const mainBtn = document.getElementById('mainBtn');
    const copyArea = document.getElementById('copyArea');
    const resultTextArea = document.getElementById('resultText');
    
    let measurements = { shoulder: 0, chest: 0, sleeve: 0, inseam: 0, size: "" };
    let isCounting = false;

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);
            const bodyPx = Math.abs(lm[27].y - lm[0].y);
            const ratio = h / (bodyPx * 1.18); 
            if (bodyPx > 0) {
                measurements.shoulder = Math.sqrt(Math.pow(lm[11].x-lm[12].x, 2)+Math.pow(lm[11].y-lm[12].y, 2)) * canvasElement.width * ratio;
                measurements.chest = Math.abs(lm[23].x - lm[24].x) * canvasElement.width * ratio * 1.25;
                measurements.sleeve = Math.sqrt(Math.pow(lm[11].x-lm[15].x, 2)+Math.pow(lm[11].y-lm[15].y, 2)) * canvasElement.width * ratio;
                measurements.inseam = Math.abs(lm[23].y - lm[27].y) * canvasElement.height * ratio;
                document.getElementById('shW').innerText = measurements.shoulder.toFixed(1);
                document.getElementById('chW').innerText = measurements.chest.toFixed(1);
                document.getElementById('slL').innerText = measurements.sleeve.toFixed(1);
                document.getElementById('inL').innerText = measurements.inseam.toFixed(1);
                decideSize(measurements.shoulder, measurements.chest);
            }
        }
        canvasCtx.restore();
    }

    function decideSize(s, c) {
        let sld = "M";
        if (s > 52 || c > 54) sld = "3L";
        else if (s > 48 || c > 50) sld = "LL";
        else if (s > 44 || c > 46) sld = "L";
        else if (s > 40 || c > 42) sld = "M";
        else sld = "S";
        measurements.size = sld;
        document.getElementById('finalSize').innerText = sld;
    }

    function startSelfTimer() {
        if (isCounting) return;
        isCounting = true;
        copyArea.style.display = "none";
        let count = 10;
        const timer = setInterval(() => {
            mainBtn.innerText = `あと ${count} 秒で確定...`;
            if (count <= 5 && count > 0) {
                const uttr = new SpeechSynthesisUtterance(count.toString());
                window.speechSynthesis.speak(uttr);
            }
            if (count <= 0) {
                clearInterval(timer);
                finishMeasurement();
            }
            count--;
        }, 1000);
    }

    function finishMeasurement() {
        const footSize = document.getElementById('footInput').value;
        const res = `【採寸結果】\nサイズ: ${measurements.size}\n肩幅: ${measurements.shoulder.toFixed(1)}cm\n身幅: ${measurements.chest.toFixed(1)}cm\n袖丈: ${measurements.sleeve.toFixed(1)}cm\n股下: ${measurements.inseam.toFixed(1)}cm\n足のサイズ: ${footSize}cm`;
        
        resultTextArea.value = res;
        copyArea.style.display = "block";
        
        navigator.clipboard.writeText(res).then(() => {
            alert("計測完了！内容をコピーしました。");
        });

        isCounting = false;
        mainBtn.innerText = "再計測する";
    }

    function goToForms() {
        // Microsoft FormsのURLに差し替えてください
        window.location.href = "https://forms.office.com/r/XXXXXX";
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);
    new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480 }).start();
</script>
</body>
</html>
