<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>採寸テスト（iPhone最適化版）</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: white; text-align: center; }
        #canvas-container { position: relative; width: 100vw; height: 70vh; overflow: hidden; }
        canvas { width: 100%; height: 100%; object-fit: contain; }
        video { display: none; }
        .result-bar { height: 30vh; background: white; color: #333; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .res-item { background: #f0f0f0; border-radius: 8px; padding: 10px; }
        .val { font-size: 1.5rem; font-weight: bold; color: #2563eb; display: block; }
        .status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="canvas-container">
    <div id="status" class="status">カメラ起動中...</div>
    <video id="input_video" playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>
</div>

<div class="result-bar">
    <div class="res-item">肩幅<span id="shW" class="val">--</span></div>
    <div class="res-item">ウエスト<span id="waist" class="val">--</span></div>
    <div class="res-item">袖丈<span id="slL" class="val">--</span></div>
    <div class="res-item">股下<span id="inL" class="val">--</span></div>
    <div style="grid-column: 1/3; font-size: 0.7rem;">身長設定: 160cm (テスト用)</div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusEl = document.getElementById('status');

    function onResults(results) {
        if (!results.poseLandmarks) {
            statusEl.innerText = "人を探しています...";
            return;
        }
        statusEl.innerText = "● 検知中";
        statusEl.style.color = "#0f0";

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});

        const lm = results.poseLandmarks;
        const h = 160; // テスト用に160cm固定
        
        // 鼻(0)と腰(23)の距離で暫定計算（足首が映っていなくても動くように）
        const nose = lm[0];
        const hip = lm[23];
        const bodyPx = Math.abs(hip.y - nose.y) * 2.2; // 腰までの距離を全身の約半分と仮定

        if (bodyPx > 0.1) {
            const ratio = h / (bodyPx * 1.1); 
            
            // 各数値を計算
            const sh = (Math.sqrt(Math.pow(lm[11].x-lm[12].x, 2)+Math.pow(lm[11].y-lm[12].y, 2)) * canvasElement.width * ratio).toFixed(1);
            const ws = (Math.abs(lm[23].x - lm[24].x) * canvasElement.width * ratio * 2.4).toFixed(1);
            const sl = (Math.sqrt(Math.pow(lm[11].x-lm[15].x, 2)+Math.pow(lm[11].y-lm[15].y, 2)) * canvasElement.width * ratio).toFixed(1);
            const inseam = (Math.abs(lm[23].y - lm[27].y) * canvasElement.height * ratio).toFixed(1);

            // 異常値でない場合のみ表示
            if (sh > 10 && sh < 100) {
                document.getElementById('shW').innerText = sh + "cm";
                document.getElementById('waist').innerText = ws + "cm";
                document.getElementById('slL').innerText = sl + "cm";
                document.getElementById('inL').innerText = inseam + "cm";
            }
        }
        canvasCtx.restore();
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 0, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => { await pose.send({image: videoElement}); },
        width: 640, height: 480
    });
    camera.start().then(() => { statusEl.innerText = "カメラ起動成功"; });
</script>
</body>
</html>
