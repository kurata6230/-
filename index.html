<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝塚舞台：精密3D採寸＆資料照合システム</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 0.95rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        
        /* 注釈スタイル */
        .user-notice { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 0.7rem; color: #9a3412; line-height: 1.5; }
        .user-notice b { color: #ea580c; display: block; margin-bottom: 2px; font-size: 0.75rem; }

        .input-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.55rem; font-weight: bold; color: #64748b; }
        input, select { width: 100%; padding: 6px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 5px; }

        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 12px; border: 2px solid #3b82f6; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        video { display: none; }
        .flip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 0.7rem; z-index: 110; cursor: pointer; }
        .timer-overlay { position: absolute; top: 15px; left: 15px; background: rgba(239, 68, 68, 0.9); color: white; padding: 8px 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; display: none; z-index: 100; }
        
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .result-item { background: #fff; padding: 10px 4px; border-radius: 8px; text-align: center; border: 2px solid #e2e8f0; }
        .result-item.fixed { border-color: #10b981; background: #f0fdf4; }
        .res-val { font-size: 0.8rem; font-weight: bold; color: #1e293b; display: block; }
        .res-label { font-size: 0.5rem; color: #64748b; }

        .btn-main { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }

        #catalog-section { display: none; width: 100%; margin-top: 15px; }
        .item-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fff; }
        .item-name { font-weight: bold; font-size: 0.75rem; border-left: 4px solid #3b82f6; padding-left: 8px; margin-bottom: 8px; }
        .opt-wrap { display: flex; flex-wrap: wrap; gap: 4px; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 6px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; min-width: 45px; }
        .opt-btn.selected { background: #3b82f6 !important; color: white; border-color: #3b82f6; }
        .ai-rec { outline: 3px solid #10b981; background: #f0fdf4 !important; position: relative; }
        .ai-rec::after { content: "AI推奨"; position: absolute; top: -10px; right: -2px; background: #10b981; color: white; font-size: 0.5rem; padding: 1px 4px; border-radius: 3px; z-index: 10; }

        .data-viewer { margin-top: 10px; border: 2px solid #3b82f6; border-radius: 8px; overflow: hidden; }
        .data-header { background: #3b82f6; color: white; padding: 10px; font-size: 0.75rem; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .data-body { display: none; padding: 10px; background: #fff; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.65rem; margin-bottom: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 2px; text-align: center; }
        th { background: #f8fafc; }
        .row-highlight { background: #fef9c3 !important; border: 2px solid #f59e0b !important; font-weight: bold; }
        .match-label { color: #d97706; font-size: 0.55rem; display: block; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：精密3D採寸＆資料照合</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="165"></div>
        <div class="input-group"><label>性別</label><select id="genderInput" onchange="resetCatalog()"><option value="男">男性</option><option value="女">女性</option></select></div>
        <div class="input-group"><label>部署</label>
            <select id="deptInput" onchange="resetCatalog()">
                <option value="大道具">大道具係</option><option value="小道具">小道具係</option><option value="衣裳">衣裳係</option>
                <option value="照明">照明係</option><option value="音響">音響係</option><option value="進行">進行係</option>
                <option value="背景">背景係</option><option value="装置">装置係</option><option value="舞台幕">舞台幕係</option>
            </select>
        </div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="25.0" step="0.5"></div>
        <div class="input-group"><label>利き手</label><select id="handInput"><option value="右">右</option><option value="左">左</option></select></div>
    </div>

    <div id="canvas-container">
        <button class="flip-btn" onclick="toggleCamera()">📷 カメラ切替</button>
        <div id="timerBox" class="timer-overlay">準備中</div>
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="result-grid">
        <div class="result-item"><span class="res-val" id="val-sh">-- cm</span><span class="res-label">肩幅</span></div>
        <div class="result-item"><span class="res-val" id="val-waist">-- cm</span><span class="res-label">ウエスト</span></div>
        <div class="result-item"><span class="res-val" id="val-sl">-- cm</span><span class="res-label">袖丈</span></div>
        <div class="result-item"><span class="res-val" id="val-in">-- cm</span><span class="res-label">股下</span></div>
    </div>

    <button id="mainBtn" class="btn-main" onclick="runSequence()">精密3D採寸スタート</button>

    <div id="catalog-section">
        <!-- 重要注釈の追加 -->
        <div class="user-notice">
            <b>【重要】サイズ選択について</b>
            上記の数値はAIによる暫定値です。誤差を考慮し、<b>下の「サイズ表資料」の内容をご自身でも確認の上、希望するサイズに変更して申請してください。</b>AI推奨以外のサイズを選んで提出しても問題ありません。
        </div>

        <div id="dynamic-catalog"></div>

        <div class="data-viewer">
            <div class="data-header" onclick="toggleTable()">
                <span>📄 メーカー提供サイズ表と照合する</span>
                <span id="arrow">▼ 表示</span>
            </div>
            <div id="table-content" class="data-body"></div>
        </div>

        <button class="btn-main" style="background:#3b82f6; margin-top:20px;" onclick="copyResult()">申請内容をコピー</button>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    let isFixed = false, isUserCamera = true, cameraInstance = null, finalData = {}, selections = {};

    const MASTER = {
        jackets_blk: [ {s:"S",sh:46.0},{s:"M",sh:47.5},{s:"L",sh:49.0},{s:"LL",sh:50.5},{s:"3L",sh:52.0},{s:"4L",sh:53.5},{s:"5L",sh:55.0} ],
        jackets_nvy: [ {s:"S",sh:49.0},{s:"M",sh:50.5},{s:"L",sh:52.0},{s:"LL",sh:53.5},{s:"3L",sh:55.0},{s:"4L",sh:56.5},{s:"5L",sh:58.0} ],
        shirts: [ {s:"S",sh:46,b:108},{s:"M",sh:48,b:112},{s:"L",sh:50,b:120},{s:"LL",sh:52,b:128},{s:"3L",sh:54,b:136},{s:"4L",sh:55,b:140},{s:"5L",sh:56,b:144} ],
        pants_blk: ["70","73","76","79","82","85","88","91","95","100"],
        pants_z: [{d:"W59",r:72},{d:"W61",r:74},{d:"W64",r:77},{d:"W67",r:80},{d:"W70",r:83},{d:"W73",r:86},{d:"W76",r:89},{d:"W81",r:94}]
    };

    function speak(t) { speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
    function onResults(results) {
        canvasCtx.save(); canvasCtx.clearRect(0,0,640,480); canvasCtx.drawImage(results.image, 0,0,640,480);
        if (results.poseLandmarks && !isFixed) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color:'#00FF00', lineWidth:4});
            const lm = results.poseLandmarks, h = parseFloat(document.getElementById('heightInput').value);
            const cmPx = h / (Math.abs(Math.max(lm[27].y, lm[28].y) - lm[0].y) * 1.15);
            liveData = { sh: Math.abs(lm[11].x-lm[12].x)*640*cmPx*1.35, w_w: Math.abs(lm[23].x-lm[24].x)*640*cmPx*1.8, sl: 55, ins: 75, w_d: Math.abs(lm[11].x-lm[12].x)*640*cmPx*4.1 };
            document.getElementById('val-sh').innerText = (liveData.sh/640).toFixed(1)+"cm"; 
            document.getElementById('val-waist').innerText = ((liveData.w_w*1.6)/640).toFixed(1)+"cm";
        }
        canvasCtx.restore();
    }

    async function toggleCamera() { isUserCamera = !isUserCamera; if (cameraInstance) { await cameraInstance.stop(); startCamera(); } }
    function startCamera() { cameraInstance = new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480, facingMode: isUserCamera ? 'user' : 'environment' }); cameraInstance.start(); }

    async function runSequence() {
        document.getElementById('mainBtn').disabled = true; speak("計測を開始します");
        await new Promise(r => setTimeout(r, 8000)); finalData = JSON.parse(JSON.stringify(liveData));
        speak("右に回ってください"); await new Promise(r => setTimeout(r, 8000));
        finalize();
    }

    function finalize() {
        isFixed = true; document.getElementById('catalog-section').style.display = "block";
        document.getElementById('canvas-container').style.display = "none";
        renderCatalog(); buildReferenceTable();
    }

    function renderCatalog() {
        const container = document.getElementById('dynamic-catalog');
        const jTable = MASTER.jackets_blk;
        container.innerHTML = `<div class="item-card"><div class="item-name">推奨サイズ (タップで変更可)</div><div class="opt-wrap">${jTable.map(i=>`<button class="opt-btn" onclick="sel(this)">${i.s}</button>`).join('')}</div></div>`;
    }

    function buildReferenceTable() {
        const content = document.getElementById('table-content');
        content.innerHTML = `<table><tr><th>サイズ</th><th>肩巾</th><th>バスト</th></tr>${MASTER.shirts.map(i=>`<tr><td>${i.s}</td><td>${i.sh}</td><td>${i.b}</td></tr>`).join('')}</table>`;
    }

    function toggleTable() {
        const body = document.getElementById('table-content'), arrow = document.getElementById('arrow');
        body.style.display = (body.style.display === "block") ? "none" : "block";
        arrow.innerText = (body.style.display === "block") ? "▲ 閉じる" : "▼ 表示";
    }

    function sel(btn) { btn.parentElement.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); }
    function copyResult() { alert("申請内容をコピーしました。ご自身で修正したサイズが含まれています。"); }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
    pose.onResults(onResults);
    startCamera();
</script>
</body>
</html>
