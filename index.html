<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝塚舞台：精密採寸DX（数値確定版）</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 0.9rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; background: #f8fafc; padding: 8px; border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.55rem; font-weight: bold; color: #64748b; }
        input, select { width: 100%; padding: 5px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 4px; }

        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 10px; border: 3px solid #e2e8f0; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        
        /* タイマー表示 */
        .timer-overlay { position: absolute; top: 15px; left: 15px; background: rgba(239, 68, 68, 0.9); color: white; padding: 8px 15px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; display: none; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .guide-msg { position: absolute; top: 50%; width: 100%; text-align: center; color: white; pointer-events: none; transform: translateY(-50%); }
        .guide-inner { background: rgba(0,0,0,0.7); display: inline-block; padding: 15px 25px; border-radius: 12px; font-size: 0.9rem; border: 2px solid #3b82f6; }
        
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 15px; }
        .result-item { background: #fff; padding: 8px 4px; border-radius: 6px; text-align: center; border: 2px solid #e2e8f0; transition: 0.3s; }
        .result-item.fixed { border-color: #10b981; background: #f0fdf4; scale: 1.05; }
        .res-label { font-size: 0.5rem; color: #64748b; display: block; }
        .res-val { font-size: 0.9rem; font-weight: bold; color: #1e293b; }

        .btn-main { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #059669; }
        .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 #059669; }

        #catalog-section { display: none; width: 100%; margin-top: 15px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 8px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; margin: 2px; min-width: 45px; }
        .ai-rec { outline: 3px solid #10b981; background: #f0fdf4 !important; font-weight: bold; }
        .selected { background: #3b82f6 !important; color: white; border-color: #3b82f6; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：3D立体採寸ポータル</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="165"></div>
        <div class="input-group"><label>性別</label><select id="genderInput"><option value="女">女性</option><option value="男">男性</option></select></div>
        <div class="input-group"><label>部署</label>
            <select id="deptInput">
                <option value="制作">制作</option><option value="大道具">大道具</option><option value="衣裳">衣裳</option><option value="進行">進行</option><option value="背景">背景</option>
            </select>
        </div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="24.5" step="0.5"></div>
        <div class="input-group"><label>利き手</label><select id="handInput"><option value="右">右</option><option value="左">左</option></select></div>
    </div>

    <div id="canvas-container">
        <div id="timerBox" class="timer-overlay">準備中</div>
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="output_canvas"></canvas>
        <div class="guide-msg" id="guideMsg">
            <div class="guide-inner" id="guideText">カメラを固定し、<br>全身を映してください</div>
        </div>
    </div>

    <div class="result-grid" id="resultGrid">
        <div class="result-item" id="box-sh"><span class="res-label">肩幅</span><span class="res-val" id="val-sh">--</span></div>
        <div class="result-item" id="box-waist"><span class="res-label">ウエスト</span><span class="res-val" id="val-waist">--</span></div>
        <div class="result-item" id="box-sl"><span class="res-label">袖丈</span><span class="res-val" id="val-sl">--</span></div>
        <div class="result-item" id="box-in"><span class="res-label">股下</span><span class="res-val" id="val-in">--</span></div>
    </div>

    <button id="mainBtn" class="btn-main" onclick="runSequence()">採寸開始 (正面・側面)</button>

    <div id="catalog-section">
        <div style="background:#f8fafc; padding:10px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:10px; font-size:0.7rem;">
            <b>採寸完了:</b> 数値が固定されました。以下から希望サイズを選んでください。
        </div>
        <div id="dynamic-catalog"></div>
        <button class="btn-main" style="background:#3b82f6; margin-top:10px; box-shadow: 0 4px 0 #2563eb;" onclick="copyResult()">結果をコピーして終了</button>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    let isFixed = false; // 数値を固定するかどうか
    let currentPhase = 'wait'; 
    let liveData = { sh:0, w_width:0, w_depth:0, sl:0, inseam:0 };
    let finalData = { sh:0, waist:0, sl:0, inseam:0 };

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks && !isFixed) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);

            // 地面推定と比率計算
            const groundY = Math.max(lm[27].y, lm[28].y, lm[29].y, lm[30].y);
            const headY = lm[0].y;
            const cmPx = h / (Math.abs(groundY - headY) * 1.15);

            // リアルタイム計算
            liveData.sh = Math.abs(lm[11].x - lm[12].x) * canvasElement.width * cmPx * 1.35;
            liveData.w_width = Math.abs(lm[23].x - lm[24].x) * canvasElement.width * cmPx * 1.8;
            liveData.sl = Math.sqrt(Math.pow(lm[11].x-lm[15].x,2)+Math.pow(lm[11].y-lm[15].y,2)) * canvasElement.width * cmPx;
            const hipCenterY = (lm[23].y + lm[24].y) / 2;
            liveData.inseam = Math.abs(groundY - hipCenterY) * canvasElement.height * cmPx * 1.05;
            liveData.w_depth = Math.abs(lm[11].x - lm[12].x) * canvasElement.width * cmPx * 4.2;

            // 画面の数値を更新（固定されるまで動き続ける）
            document.getElementById('val-sh').innerText = liveData.sh.toFixed(1);
            document.getElementById('val-sl').innerText = liveData.sl.toFixed(1);
            document.getElementById('val-in').innerText = liveData.inseam.toFixed(1);
            document.getElementById('val-waist').innerText = (liveData.w_width * 1.6).toFixed(1); // 暫定
        }
        canvasCtx.restore();
    }

    async function runSequence() {
        const btn = document.getElementById('mainBtn');
        const timerBox = document.getElementById('timerBox');
        btn.disabled = true;
        timerBox.style.display = "block";

        // --- PHASE 1: 正面 ---
        currentPhase = 'front';
        document.getElementById('guideText').innerHTML = "【正面の計測】<br>姿勢を正して10秒キープ...";
        await countdown(10);
        
        // 正面数値を一時保存
        finalData.sh = liveData.sh;
        finalData.sl = liveData.sl;
        finalData.inseam = liveData.inseam;
        const frontWaistWidth = liveData.w_width;

        // --- PHASE 2: 側面 ---
        currentPhase = 'side';
        document.getElementById('guideText').innerHTML = "【側面の計測】<br>右側に90度回転してください";
        speechSynthesis.speak(new SpeechSynthesisUtterance("右に向いてください"));
        await countdown(10);
        
        // 側面の厚みを保存し、最終計算
        const sideWaistDepth = liveData.w_depth;
        
        // ウエスト周囲径の確定 (楕円近似)
        const a = frontWaistWidth / 2;
        const b = sideWaistDepth / 2;
        const h_val = Math.pow(a-b,2)/Math.pow(a+b,2);
        finalData.waist = (Math.PI * (a+b) * (1 + (3*h_val)/(10 + Math.sqrt(4-3*h_val))));

        // --- 数値を固定 ---
        finalizeMeasurements();
    }

    function countdown(sec) {
        return new Promise(resolve => {
            let c = sec;
            const timer = setInterval(() => {
                document.getElementById('timerBox').innerText = `あと ${c} 秒`;
                if (c <= 3 && c > 0) speechSynthesis.speak(new SpeechSynthesisUtterance(c));
                if (c <= 0) { clearInterval(timer); resolve(); }
                c--;
            }, 1000);
        });
    }

    function finalizeMeasurements() {
        isFixed = true; // onResults内での更新を停止
        
        // 数値を最終結果に書き換え、スタイルを変更
        document.getElementById('val-sh').innerText = finalData.sh.toFixed(1);
        document.getElementById('val-sl').innerText = finalData.sl.toFixed(1);
        document.getElementById('val-in').innerText = finalData.inseam.toFixed(1);
        document.getElementById('val-waist').innerText = finalData.waist.toFixed(1);
        
        document.querySelectorAll('.result-item').forEach(el => el.classList.add('fixed'));
        
        document.getElementById('canvas-container').style.display = "none";
        document.getElementById('mainBtn').style.display = "none";
        document.getElementById('catalog-section').style.display = "block";
        
        renderCatalog();
    }

    function renderCatalog() {
        const dept = document.getElementById('deptInput').value;
        const isNavy = ["大道具", "背景"].includes(dept);
        const container = document.getElementById('dynamic-catalog');
        
        // ここに推奨ロジック（TABLESとの照合）を入れ、ボタンを生成
        // ※コード短縮のため前回のrenderCatalogロジックを適用
        let html = `<div class="item-card"><div class="item-name">${isNavy?'上着(紺)':'上着(黒)'}</div><div class="opt-wrap">`;
        const jTable = isNavy ? [{s:"S",w:49},{s:"M",w:50.5},{s:"L",w:52},{s:"LL",w:53.5},{s:"3L",w:55}] : [{s:"S",w:46},{s:"M",w:47.5},{s:"L",w:49},{s:"LL",w:50.5},{s:"3L",w:52}];
        jTable.forEach(i => {
            const isRec = finalData.sh >= i.w - 1 && finalData.sh < i.w + 1.5;
            html += `<button class="opt-btn ${isRec?'ai-rec':''}" onclick="sel(this,'上着','${i.s}')">${i.s}</button>`;
        });
        html += `</div></div>`;
        container.innerHTML = html;
    }

    function sel(btn, cat, val) {
        btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
    pose.onResults(onResults);
    new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480 }).start();
</script>
</body>
</html>
