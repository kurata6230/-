<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝塚舞台：採寸ポータル【iPhone14対応】</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 550px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 0.9rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        
        /* 入力エリア */
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.6rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
        input, select { width: 100%; padding: 8px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; }

        /* カメラエリア */
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 10px; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        .flip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 0.65rem; z-index: 100; }
        
        /* ガイド表示 */
        .status-msg { position: absolute; bottom: 10%; width: 100%; text-align: center; color: white; font-size: 0.7rem; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 0; }

        /* 測定数値表示（cm） */
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
        .result-item { background: #f1f5f9; padding: 6px; border-radius: 6px; text-align: center; border: 1px solid #e2e8f0; }
        .res-label { font-size: 0.5rem; color: #64748b; display: block; }
        .res-val { font-size: 0.85rem; font-weight: bold; color: #2563eb; }

        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; background: #10b981; color: white; }
        #catalog-section { display: none; margin-top: 15px; width: 100%; border-top: 2px dashed #ccc; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：採寸ポータル【iPhone14対応版】</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>性別</label><select id="genderInput"><option value="女">女性</option><option value="男">男性</option></select></div>
        <div class="input-group"><label>部署</label><select id="deptInput"><option value="大道具">大道具</option><option value="衣裳">衣裳</option><option value="進行">進行</option><option value="照明">照明</option></select></div>
        <div class="input-group"><label>利き手</label><select id="handInput"><option value="右">右</option><option value="左">左</option></select></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="160"></div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="23.5" step="0.5"></div>
    </div>

    <div id="canvas-container">
        <button class="flip-btn" onclick="toggleCamera()">📷 カメラ切替</button>
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="output_canvas"></canvas>
        <div id="statusBox" class="status-msg">カメラ準備中...</div>
    </div>

    <div class="result-grid">
        <div class="result-item"><span class="res-label">肩幅</span><span class="res-val"><span id="shW">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">ウエスト</span><span class="res-val"><span id="waist">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">袖丈</span><span class="res-val"><span id="slL">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">股下</span><span class="res-val"><span id="inL">--</span> cm</span></div>
    </div>

    <button id="mainBtn" class="action-btn" onclick="startSelfTimer()">採寸スタート (10秒)</button>

    <div id="catalog-section">
        <textarea id="resultText" style="width:100%; height:150px; font-size:0.75rem; border:1px solid #3b82f6; border-radius:8px; background:#f8fafc; padding:10px;"></textarea>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusBox = document.getElementById('statusBox');
    
    let measurements = { shoulder:0, waist:0, sleeve:0, inseam:0 };
    let isUserCamera = true;
    let cameraInstance = null;

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            const lm = results.poseLandmarks;
            const userHeight = parseFloat(document.getElementById('heightInput').value);

            // 【iPhone14用新ロジック】ピクセルに依存せず「正規化座標(0-1)」の比率だけで計算
            const nose = lm[0];
            const leftAnkle = lm[27];
            const rightAnkle = lm[28];
            const ankleY = (leftAnkle.y + rightAnkle.y) / 2;

            // 全身の「比率」としての高さ
            const bodyRatio = Math.abs(ankleY - nose.y);

            if (bodyRatio > 0.1) {
                statusBox.innerText = "● 検知中：離れて足元まで映してください";
                statusBox.style.color = "#0f0";

                // 1.15は鼻から頭頂部までの補正
                const factor = userHeight / (bodyRatio * 1.15);

                // 各部位の「正規化距離」をcmに変換
                const shDist = Math.sqrt(Math.pow(lm[11].x - lm[12].x, 2) + Math.pow(lm[11].y - lm[12].y, 2));
                const wsDist = Math.abs(lm[23].x - lm[24].x) * 2.4; // 一周補正
                const slDist = Math.sqrt(Math.pow(lm[11].x - lm[15].x, 2) + Math.pow(lm[11].y - lm[15].y, 2));
                const inDist = Math.abs(lm[23].y - lm[27].y);

                measurements.shoulder = (shDist * factor).toFixed(1);
                measurements.waist = (wsDist * factor).toFixed(1);
                measurements.sleeve = (slDist * factor).toFixed(1);
                measurements.inseam = (inDist * factor).toFixed(1);

                // 数値が妥当な場合のみ表示
                if (parseFloat(measurements.shoulder) > 20) {
                    document.getElementById('shW').innerText = measurements.shoulder;
                    document.getElementById('waist').innerText = measurements.waist;
                    document.getElementById('slL').innerText = measurements.sleeve;
                    document.getElementById('inL').innerText = measurements.inseam;
                }
            }
        }
        canvasCtx.restore();
    }

    async function toggleCamera() {
        isUserCamera = !isUserCamera;
        if (cameraInstance) { await cameraInstance.stop(); startCamera(); }
    }

    function startCamera() {
        cameraInstance = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 640, height: 480,
            facingMode: isUserCamera ? 'user' : 'environment'
        });
        cameraInstance.start().then(() => { statusBox.innerText = "カメラ起動完了"; });
    }

    function startSelfTimer() {
        let count = 10;
        document.getElementById('mainBtn').disabled = true;
        const timer = setInterval(() => {
            document.getElementById('mainBtn').innerText = `あと ${count} 秒...`;
            if (count <= 0) {
                clearInterval(timer);
                document.getElementById('catalog-section').style.display = "block";
                finishOrder();
            }
            count--;
        }, 1000);
    }

    function finishOrder() {
        const res = `【採寸結果】\n肩幅:${measurements.shoulder}cm / 腰:${measurements.waist}cm\n袖丈:${measurements.sleeve}cm / 股下:${measurements.inseam}cm`;
        document.getElementById('resultText').value = res;
        navigator.clipboard.writeText(res);
        alert("計測完了！結果をコピーしました。");
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);
    startCamera();
</script>
</body>
</html>
