<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝塚舞台：採寸ポータル【高精度ガード版】</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 600px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 1.1rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.65rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
        input, select { width: 100%; padding: 8px; font-size: 0.9rem; border: 1px solid #cbd5e1; border-radius: 6px; }
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 10px; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        .flip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; z-index: 100; }
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .result-item { background: #f1f5f9; padding: 5px; border-radius: 6px; text-align: center; border: 1px solid #e2e8f0; }
        .res-label { font-size: 0.55rem; color: #64748b; display: block; }
        .res-val { font-size: 0.85rem; font-weight: bold; color: #2563eb; }
        #catalog-section { display: none; border-top: 2px dashed #cbd5e1; padding-top: 15px; width: 100%; }
        .item-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
        .item-name { font-weight: bold; font-size: 0.85rem; color: #1e293b; margin-bottom: 8px; border-left: 4px solid #3b82f6; padding-left: 8px; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 6px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; margin-right: 3px; margin-bottom: 3px; min-width: 38px; }
        .opt-btn.selected { background: #3b82f6; color: white; border-color: #3b82f6; }
        .ai-rec { border: 2px solid #10b981 !important; position: relative; }
        .ai-rec::after { content: "推奨"; position: absolute; top: -10px; right: -5px; background: #10b981; color: white; font-size: 0.5rem; padding: 1px 3px; border-radius: 3px; z-index: 10; }
        .action-btn { width: 100%; padding: 18px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-measure { background: #10b981; color: white; }
        .btn-order { background: #3b82f6; color: white; }
        textarea { width: 100%; height: 280px; padding: 10px; border-radius: 8px; border: 1px solid #3b82f6; font-size: 0.75rem; background: #f8fafc; margin-top: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：2026年度 採寸ポータル</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>性別</label>
            <select id="genderInput" onchange="toggleGenderItems()"><option value="女">女性</option><option value="男">男性</option></select>
        </div>
        <div class="input-group"><label>部署</label>
            <select id="deptInput" onchange="toggleDeptItems()">
                <option value="大道具">大道具</option><option value="衣裳">衣裳</option>
                <option value="進行">進行</option><option value="照明">照明</option>
            </select>
        </div>
        <div class="input-group"><label>利き手</label>
            <select id="handInput"><option value="右">右</option><option value="左">左</option></select>
        </div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="160"></div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="23.5" step="0.5"></div>
    </div>

    <div id="canvas-container">
        <button class="flip-btn" onclick="toggleCamera()">📷 カメラ切替</button>
        <video id="input_video"></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="result-grid">
        <div class="result-item"><span class="res-label">肩幅</span><span class="res-val"><span id="shW">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">ウエスト</span><span class="res-val"><span id="waist">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">袖丈</span><span class="res-val"><span id="slL">--</span> cm</span></div>
        <div class="result-item"><span class="res-label">股下</span><span class="res-val"><span id="inL">--</span> cm</span></div>
    </div>

    <button id="mainBtn" class="action-btn btn-measure" onclick="startSelfTimer()">採寸スタート (10秒)</button>

    <div id="catalog-section">
        <div class="item-card">
            <div class="item-name">黒上着 / 長袖シャツ / ベスト / 防寒着</div>
            <div class="select-area">
                <button class="opt-btn" id="rec-u-S" onclick="sel(this,'上着系','S')">S</button>
                <button class="opt-btn" id="rec-u-M" onclick="sel(this,'上着系','M')">M</button>
                <button class="opt-btn" id="rec-u-L" onclick="sel(this,'上着系','L')">L</button>
                <button class="opt-btn" id="rec-u-2L" onclick="sel(this,'上着系','2L')">2L</button>
            </div>
        </div>
        <div class="item-card" id="card-pants">
            <div class="item-name">黒ズボン (W70-W120)</div>
            <div class="select-area">
                <button class="opt-btn" id="rec-p-W76" onclick="sel(this,'ズボン','W76')">W76</button>
                <button class="opt-btn" id="rec-p-W79" onclick="sel(this,'ズボン','W79')">W79</button>
                <button class="opt-btn" id="rec-p-W82" onclick="sel(this,'ズボン','W82')">W82</button>
                <button class="opt-btn" id="rec-p-W85" onclick="sel(this,'ズボン','W85')">W85</button>
            </div>
        </div>
        <button class="action-btn btn-order" onclick="finishOrder()">内容を確定してコピー</button>
    </div>
    <textarea id="resultText" style="display:none;"></textarea>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const mainBtn = document.getElementById('mainBtn');
    
    let measurements = { shoulder:"--", waist:"--", sleeve:"--", inseam:"--" };
    let isUserCamera = true;
    let camera = null;

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            
            const lm = results.poseLandmarks;
            const h = parseFloat(document.getElementById('heightInput').value);
            
            // 重要：足首(27)と鼻(0)の両方が「見えている」場合のみ計算する（ガード機能）
            if (lm[27].visibility > 0.5 && lm[0].visibility > 0.5) {
                const bodyPx = Math.abs(lm[27].y - lm[0].y);
                const ratio = h / (bodyPx * 1.18); 

                // 異常値を防ぐため、ratioが極端に大きい場合は無視する
                if (ratio < 10) { 
                    measurements.shoulder = (Math.sqrt(Math.pow(lm[11].x-lm[12].x, 2)+Math.pow(lm[11].y-lm[12].y, 2)) * canvasElement.width * ratio).toFixed(1);
                    measurements.waist = (Math.abs(lm[23].x - lm[24].x) * canvasElement.width * ratio * 2.4).toFixed(1);
                    measurements.sleeve = (Math.sqrt(Math.pow(lm[11].x-lm[15].x, 2)+Math.pow(lm[11].y-lm[15].y, 2)) * canvasElement.width * ratio).toFixed(1);
                    measurements.inseam = (Math.abs(lm[23].y - lm[27].y) * canvasElement.height * ratio).toFixed(1);

                    document.getElementById('shW').innerText = measurements.shoulder;
                    document.getElementById('waist').innerText = measurements.waist;
                    document.getElementById('slL').innerText = measurements.sleeve;
                    document.getElementById('inL').innerText = measurements.inseam;
                }
            } else {
                // 全身が見えていないときは「--」に戻す
                document.getElementById('shW').innerText = "--";
                document.getElementById('waist').innerText = "--";
                document.getElementById('slL').innerText = "--";
                document.getElementById('inL').innerText = "--";
            }
        }
        canvasCtx.restore();
    }

    function toggleCamera() { isUserCamera = !isUserCamera; if (camera) { camera.stop(); startCamera(); } }
    function startCamera() {
        camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 640, height: 480, facingMode: isUserCamera ? 'user' : 'environment'
        });
        camera.start();
    }
    function startSelfTimer() {
        let count = 10; mainBtn.disabled = true;
        const timer = setInterval(() => {
            mainBtn.innerText = `あと ${count} 秒...`;
            if (count <= 3 && count > 0) window.speechSynthesis.speak(new SpeechSynthesisUtterance(count));
            if (count <= 0) {
                clearInterval(timer);
                if(measurements.shoulder === "--") {
                    alert("全身が映っていなかったため計測できませんでした。離れてもう一度お試しください。");
                    location.reload();
                } else {
                    mainBtn.style.display = "none";
                    document.getElementById('catalog-section').style.display = "block";
                    recommend();
                }
            }
            count--;
        }, 1000);
    }
    function recommend() {
        const sh = parseFloat(measurements.shoulder); const ws = parseFloat(measurements.waist);
        const uRec = (sh > 47) ? "2L" : (sh > 44) ? "L" : (sh > 41) ? "M" : "S";
        const uBtn = document.getElementById("rec-u-" + uRec); if(uBtn) uBtn.classList.add('ai-rec');
        const pRec = (ws > 82) ? "W85" : (ws > 79) ? "W82" : (ws > 76) ? "W79" : (ws > 73) ? "W76";
        const pBtn = document.getElementById("rec-p-" + pRec); if(pBtn) pBtn.classList.add('ai-rec');
    }
    function sel(btn, item, val) {
        const parent = btn.parentElement; parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected'); selections[item] = val;
    }
    function finishOrder() {
        let res = `【採寸報告】\n氏名: ${document.getElementById('nameInput').value}\n肩幅:${measurements.shoulder}cm / ウエスト:${measurements.waist}cm / 袖丈:${measurements.sleeve}cm / 股下:${measurements.inseam}cm`;
        const resText = document.getElementById('resultText'); resText.value = res; resText.style.display = "block";
        navigator.clipboard.writeText(res); alert("コピーしました。");
    }
    function toggleGenderItems() { document.getElementById('card-slim').style.display = (document.getElementById('genderInput').value === "女") ? "block" : "none"; }
    function toggleDeptItems() { document.getElementById('card-isho').style.display = (document.getElementById('deptInput').value === "衣裳") ? "block" : "none"; }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);
    startCamera();
    toggleGenderItems(); toggleDeptItems();
</script>
</body>
</html>
