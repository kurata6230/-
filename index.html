<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝塚舞台：精密3D採寸＆全部署DX最終版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 16px; padding: 15px; max-width: 550px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); box-sizing: border-box; }
        h1 { font-size: 0.95rem; color: #1e293b; margin: 0 0 10px 0; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        
        /* 入力エリア */
        .input-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.55rem; font-weight: bold; color: #64748b; margin-bottom: 2px; }
        input, select { width: 100%; padding: 6px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 5px; }

        /* カメラエリア */
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; margin-bottom: 12px; border: 2px solid #3b82f6; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        video { display: none; }
        .flip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 0.7rem; z-index: 110; cursor: pointer; }
        .timer-overlay { position: absolute; top: 15px; left: 15px; background: rgba(239, 68, 68, 0.9); color: white; padding: 8px 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; display: none; z-index: 100; }
        
        /* ガイド表示 */
        .guide-msg { position: absolute; top: 50%; width: 100%; text-align: center; color: white; pointer-events: none; transform: translateY(-50%); z-index: 105; }
        .guide-inner { background: rgba(0,0,0,0.8); display: inline-block; padding: 15px 25px; border-radius: 12px; font-size: 0.9rem; border: 2px solid #3b82f6; line-height: 1.6; font-weight: bold; }
        .guide-inner b { color: #facc15; font-size: 1.1rem; }

        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .result-item { background: #fff; padding: 10px 4px; border-radius: 8px; text-align: center; border: 2px solid #e2e8f0; }
        .result-item.fixed { border-color: #10b981; background: #f0fdf4; }
        .res-val { font-size: 0.8rem; font-weight: bold; color: #1e293b; display: block; }
        .res-label { font-size: 0.5rem; color: #64748b; }

        .btn-main { width: 100%; padding: 18px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #059669; }
        .btn-start { background: #10b981; color: white; }
        .btn-restart { background: #64748b !important; color: white; box-shadow: 0 4px 0 #475569; margin-top: 10px; }

        #catalog-section { display: none; width: 100%; margin-top: 15px; }
        .user-notice { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 0.65rem; color: #9a3412; line-height: 1.4; }
        .item-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fff; }
        .item-name { font-weight: bold; font-size: 0.75rem; border-left: 4px solid #3b82f6; padding-left: 8px; margin-bottom: 8px; }
        .opt-wrap { display: flex; flex-wrap: wrap; gap: 4px; }
        .opt-btn { border: 1px solid #cbd5e1; background: #fff; padding: 6px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; min-width: 45px; }
        .selected { background: #3b82f6 !important; color: white; border-color: #3b82f6; }
        .ai-rec { outline: 3px solid #10b981; background: #f0fdf4 !important; position: relative; }
        .ai-rec::after { content: "推奨"; position: absolute; top: -10px; right: -2px; background: #10b981; color: white; font-size: 0.5rem; padding: 1px 4px; border-radius: 3px; z-index: 10; }

        .order-summary { background: #f1f5f9; border: 2px solid #3b82f6; border-radius: 12px; padding: 12px; margin: 15px 0; }
        .order-summary h3 { font-size: 0.8rem; margin: 0 0 8px 0; border-bottom: 1px solid #cbd5e1; }
        .summary-list { list-style: none; padding: 0; margin: 0; font-size: 0.75rem; }
        .summary-list li { margin-bottom: 4px; display: flex; justify-content: space-between; border-bottom: 1px dashed #cbd5e1; }

        .data-viewer { margin-top: 10px; border: 2px solid #3b82f6; border-radius: 8px; overflow: hidden; }
        .data-header { background: #3b82f6; color: white; padding: 10px; font-size: 0.75rem; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .data-body { display: none; padding: 10px; background: #fff; max-height: 500px; overflow-y: auto; }
        .table-wrapper { width: 100%; overflow-x: auto; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.55rem; white-space: nowrap; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 3px; text-align: center; }
        th { background: #f8fafc; position: sticky; top: 0; }
        .row-highlight { background: #fef9c3 !important; border: 2px solid #f59e0b !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>宝塚舞台：精密3D採寸＆全スペック照合DX</h1>
    
    <div class="input-row">
        <div class="input-group"><label>氏名</label><input type="text" id="nameInput" placeholder="氏名"></div>
        <div class="input-group"><label>身長(cm)</label><input type="number" id="heightInput" value="165"></div>
        <div class="input-group"><label>性別</label><select id="genderInput" onchange="resetCatalog()"><option value="男">男性</option><option value="女">女性</option></select></div>
        <div class="input-group"><label>部署</label>
            <select id="deptInput" onchange="resetCatalog()">
                <option value="大道具">大道具係</option><option value="小道具">小道具係</option><option value="衣裳">衣裳係</option>
                <option value="照明">照明係</option><option value="音響">音響係</option><option value="進行">進行係</option>
                <option value="背景">背景係</option><option value="装置">装置係</option><option value="舞台幕">舞台幕係</option>
                <option value="電飾">電飾係</option><option value="管理">公演管理</option>
            </select>
        </div>
        <div class="input-group"><label>靴(cm)</label><input type="number" id="shoeInput" value="25.0" step="0.5"></div>
        <div class="input-group"><label>利き手</label><select id="handInput"><option value="右">右</option><option value="左">左</option></select></div>
    </div>

    <div id="canvas-container">
        <button class="flip-btn" onclick="toggleCamera()">📷 カメラ切替</button>
        <div id="timerBox" class="timer-overlay">準備中</div>
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="output_canvas"></canvas>
        <div class="guide-msg" id="guideMsg">
            <div class="guide-inner"><b>頭から足元まで</b>映る位置に<br>離れて立ってください</div>
        </div>
    </div>

    <div class="result-grid">
        <div class="result-item" id="box-sh"><span class="res-val" id="val-sh">-- cm</span><span class="res-label">肩幅</span></div>
        <div class="result-item" id="box-waist"><span class="res-val" id="val-waist">-- cm</span><span class="res-label">ウエスト</span></div>
        <div class="result-item" id="box-sl"><span class="res-val" id="val-sl">-- cm</span><span class="res-label">袖丈</span></div>
        <div class="result-item" id="box-in"><span class="res-val" id="val-in">-- cm</span><span class="res-label">股下</span></div>
    </div>

    <button id="mainBtn" class="btn-main btn-start" onclick="runSequence()">精密3D採寸スタート</button>
    <button id="restartBtn" class="btn-main btn-restart" style="display:none" onclick="restartMeasurement()">再計測する</button>

    <div id="catalog-section">
        <div class="user-notice">数値は暫定値です。<b>下の「全スペック表」を確認し、各アイテムのサイズを選択</b>してください。</div>
        <div id="dynamic-catalog"></div>

        <div class="order-summary" id="orderSummaryBox">
            <h3>【申請サイズ確認リスト】</h3>
            <ul class="summary-list" id="summaryList"><li>サイズを選択してください...</li></ul>
        </div>

        <div class="data-viewer">
            <div class="data-header" onclick="toggleTable()"><span>📄 資料：すべての詳細スペック表を照合</span><span id="arrow">▼ 表示</span></div>
            <div id="table-content" class="data-body"></div>
        </div>

        <button class="btn-main" style="background:#3b82f6; margin-top:20px; box-shadow: 0 4px 0 #2563eb;" onclick="copyResult()">申請内容をコピーして終了</button>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    let isFixed = false, isUserCamera = true, cameraInstance = null, finalData = {}, selections = {};

    const MASTER = {
        jackets_blk: [
            {s:"S",sh:46.0,b:107,sl:53.5,l:61},{s:"M",sh:47.5,b:111,sl:56.5,l:63},{s:"L",sh:49.0,b:115,sl:59.0,l:65},
            {s:"LL",sh:50.5,b:119,sl:60.5,l:67},{s:"3L",sh:52.0,b:123,sl:61.0,l:69},{s:"4L",sh:53.5,b:127,sl:61.0,l:71},{s:"5L",sh:55.0,b:131,sl:61.0,l:71}
        ],
        jackets_nvy: [
            {s:"S",sh:49.0,b:107,sl:50.0,l:61},{s:"M",sh:50.5,b:111,sl:53.0,l:63},{s:"L",sh:52.0,b:115,sl:55.5,l:65},
            {s:"LL",sh:53.5,b:119,sl:57.0,l:67},{s:"3L",sh:55.0,b:123,sl:57.5,l:69},{s:"4L",sh:56.5,b:127,sl:57.5,l:71},{s:"5L",sh:58.0,b:131,sl:57.5,l:71}
        ],
        shirts: [
            {s:"S",sh:46,b:108,sl:55,l:66},{s:"M",sh:48,b:112,sl:56,l:71},{s:"L",sh:50,b:120,sl:57,l:73},
            {s:"LL",sh:52,b:128,sl:58,l:75},{s:"3L",sh:54,b:136,sl:59,l:76},{s:"4L",sh:55,b:140,sl:60,l:77},{s:"5L",sh:56,b:144,sl:60,l:82}
        ],
        pants_blk: [
            {d:"W70",r:70,h:86,u:26,w:23},{d:"W73",r:73,h:92,u:26,w:23},{d:"W76",r:76,h:92,u:27,w:25},
            {d:"W79",r:79,h:96,u:27,w:25},{d:"W82",r:82,h:96,u:27,w:25},{d:"W85",r:85,h:98,u:27,w:27},
            {d:"W88",r:88,h:100,u:28,w:27},{d:"W91",r:91,h:108,u:29,w:27},{d:"W95",r:95,h:108,u:29,w:27},{d:"W100",r:100,h:108,u:31,w:30}
        ],
        pants_z: [
            {d:"W59",r:72,h:90,w:30.5},{d:"W61",r:74,h:92,w:31},{d:"W64",r:77,h:95,w:32},
            {d:"W67",r:80,h:98,w:33},{d:"W70",r:83,h:101,w:34},{d:"W73",r:86,h:104,w:35},
            {d:"W76",r:89,h:107,w:36},{d:"W81",r:94,h:112,w:37},{d:"W86",r:99,h:117,w:38}
        ],
        gomu: [
            {s:"3S",w:"68-77",h:91,u:23,wa:23},{s:"SS",w:"72-81",h:95,u:24,wa:24},{s:"S",w:"76-85",h:99,u:24,wa:24},
            {s:"M",w:"79-88",h:102,u:25,wa:25},{s:"L",w:"82-91",h:105,u:26,wa:26},{s:"LL",w:"85-94",h:108,u:26,wa:27}
        ]
    };

    function speak(t) { speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
    function onResults(results) {
        canvasCtx.save(); canvasCtx.clearRect(0,0,640,480); canvasCtx.drawImage(results.image, 0,0,640,480);
        if (results.poseLandmarks && !isFixed) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color:'#00FF00', lineWidth:4});
            const lm = results.poseLandmarks, h = parseFloat(document.getElementById('heightInput').value);
            const headY = lm[0].y, groundY = Math.max(lm[27].y, lm[28].y);
            const cmPx = h / (Math.abs(groundY - headY) * 1.15);
            liveData = { sh: Math.abs(lm[11].x-lm[12].x)*640*cmPx*1.35, w_w: Math.abs(lm[23].x-lm[24].x)*640*cmPx*1.8, ins: Math.abs(lm[23].y-groundY)*480*cmPx*1.05, w_d: Math.abs(lm[11].x-lm[12].x)*640*cmPx*4.1 };
            document.getElementById('val-sh').innerText = (liveData.sh/640).toFixed(1)+"cm"; 
            document.getElementById('val-waist').innerText = ((liveData.w_w*1.6)/640).toFixed(1)+"cm";
            document.getElementById('val-in').innerText = (liveData.ins/480).toFixed(1)+"cm";
        }
        canvasCtx.restore();
    }

    async function toggleCamera() { isUserCamera = !isUserCamera; if (cameraInstance) { await cameraInstance.stop(); startCamera(); } }
    function startCamera() { cameraInstance = new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480, facingMode: isUserCamera ? 'user' : 'environment' }); cameraInstance.start(); }

    function countdown(sec, label) {
        return new Promise(resolve => {
            let c = sec; document.getElementById('timerBox').style.display = "block";
            const timer = setInterval(() => {
                document.getElementById('timerBox').innerText = label + ": " + c;
                if(c <= 3 && c > 0) speak(c.toString());
                if(c <= 0) { clearInterval(timer); resolve(); }
                c--;
            }, 1000);
        });
    }

    async function runSequence() {
        document.getElementById('mainBtn').disabled = true; isFixed = false;
        speak("正面の計測を開始します。10秒間静止してください。"); await countdown(10, "正面");
        finalData = JSON.parse(JSON.stringify(liveData));
        speak("右に向いてください。側面の厚みを計測します。"); await countdown(10, "側面");
        const a = (finalData.w_w/640)/2, b = (liveData.w_d/640)/2, hv = Math.pow(a-b,2)/Math.pow(a+b,2);
        finalData.waist = Math.PI * (a+b) * (1 + (3*hv)/(10 + Math.sqrt(4-3*hv))) * 640;
        finalize();
    }

    function finalize() {
        isFixed = true; speak("計測完了。全スペック表を表示します。");
        document.getElementById('catalog-section').style.display = "block";
        document.getElementById('canvas-container').style.display = "none";
        document.getElementById('mainBtn').style.display = "none";
        document.getElementById('restartBtn').style.display = "block";
        document.getElementById('val-waist').innerText = (finalData.waist).toFixed(1) + "cm";
        document.querySelectorAll('.result-item').forEach(el => el.classList.add('fixed'));
        renderCatalog(); buildReferenceTable();
    }

    function restartMeasurement() {
        isFixed = false; selections = {};
        document.getElementById('catalog-section').style.display = "none";
        document.getElementById('canvas-container').style.display = "block";
        document.getElementById('mainBtn').style.display = "block";
        document.getElementById('mainBtn').disabled = false;
        document.getElementById('restartBtn').style.display = "none";
        document.querySelectorAll('.result-item').forEach(el => el.classList.remove('fixed'));
        document.getElementById('summaryList').innerHTML = "<li>選択してください...</li>";
    }

    function renderCatalog() {
        const dept = document.getElementById('deptInput').value, container = document.getElementById('dynamic-catalog');
        const isNavy = ["背景", "装置", "舞台幕"].includes(dept), isIsho = (dept === "衣裳");
        const jTable = isNavy ? MASTER.jackets_nvy : MASTER.jackets_blk;
        let jRec = jTable[0].s; for(let i of jTable) if((finalData.sh/640) >= i.sh - 0.5) jRec = i.s;
        let sRec = MASTER.shirts[0].s; for(let i of MASTER.shirts) if((finalData.sh/640) >= i.sh - 1) sRec = i.s;

        let html = `<div class="item-card"><div class="item-name">上着：${isNavy?'製作(紺)':'公演(黒)'}</div><div class="opt-wrap">${jTable.map(i=>`<button class="opt-btn ${i.s===jRec?'ai-rec':''}" onclick="sel(this,'上着','${i.s}')">${i.s}</button>`).join('')}</div></div>`;
        html += `<div class="item-card"><div class="item-name">長袖黒シャツ (開襟)</div><div class="opt-wrap">${MASTER.shirts.map(i=>`<button class="opt-btn ${i.s===sRec?'ai-rec':''}" onclick="sel(this,'シャツ','${i.s}')">${i.s}</button>`).join('')}</div></div>`;
        if (isIsho) {
            html += `<div class="item-card"><div class="item-name">衣裳セット (総ゴムP/たび靴)</div><div class="opt-wrap">${MASTER.gomu.map(i=>`<button class="opt-btn" onclick="sel(this,'ゴムP','${i.s}')">${i.s}</button>`).join('')}<button class="opt-btn" onclick="sel(this,'たび靴','${document.getElementById('shoeInput').value}')">たび靴</button></div></div>`;
        } else {
            let pRec = ""; if(isNavy) { for(let i of MASTER.pants_z) if(finalData.waist >= i.r - 2) pRec = i.d; } else { for(let v of MASTER.pants_blk) if(finalData.waist >= v.r - 2) pRec = v.d; }
            html += `<div class="item-card"><div class="item-name">ズボン (${isNavy?'紺':'黒'})</div><div class="opt-wrap">${(isNavy?MASTER.pants_z.map(i=>i.d):MASTER.pants_blk.map(i=>i.d)).map(v=>`<button class="opt-btn ${v===pRec?'ai-rec':''}" onclick="sel(this,'ズボン','${v}')">${v}</button>`).join('')}</div></div>`;
        }
        html += `<div class="item-card"><div class="item-name">黒半袖Tシャツ</div><div class="opt-wrap">${["S","M","L","XL","XXL"].map(v=>`<button class="opt-btn" onclick="sel(this,'Tシャツ','${v}')">${v}</button>`).join('')}</div></div>`;
        html += `<div class="item-card"><div class="item-name">防寒着 / ベスト</div><div class="opt-wrap">${["S","M","L","LL","3L"].map(v=>`<button class="opt-btn" onclick="sel(this,'防寒・ベスト','${v}')">${v}</button>`).join('')}</div></div>`;
        container.innerHTML = html;
    }

    function buildReferenceTable() {
        const content = document.getElementById('table-content'), dept = document.getElementById('deptInput').value, isNavy = ["背景", "装置", "舞台幕"].includes(dept);
        const curSH = finalData.sh/640, curW = finalData.waist;
        let sRows = MASTER.shirts.map(i => `<tr class="${(curSH >= i.sh-1 && curSH < i.sh+1.5)?'row-highlight':''}"><td>${i.s}</td><td>${i.sh}</td><td>${i.b}</td><td>${i.sl}</td><td>${i.l}</td></tr>`).join('');
        let jRows = (isNavy?MASTER.jackets_nvy:MASTER.jackets_blk).map(i => `<tr class="${(curSH >= i.sh-0.5 && curSH < i.sh+1.5)?'row-highlight':''}"><td>${i.s}</td><td>${i.sh}</td><td>${i.b}</td><td>${i.sl}</td><td>${i.l}</td></tr>`).join('');
        let pRows = isNavy ? MASTER.pants_z.map(i => `<tr class="${(curW >= i.r-2 && curW < i.r+3)?'row-highlight':''}"><td>${i.d}</td><td>${i.r}</td><td>${i.h}</td><td>${i.w}</td></tr>`).join('') : MASTER.pants_blk.map(i => `<tr class="${(curW >= i.r-2 && curW < i.r+3)?'row-highlight':''}"><td>${i.d}</td><td>${i.r}</td><td>${i.h}</td><td>${i.u}</td><td>${i.w}</td></tr>`).join('');
        content.innerHTML = `<div class="table-wrapper"><p><b>■ シャツ詳細</b></p><table><tr><th>サイズ</th><th>肩巾</th><th>バスト</th><th>袖丈</th><th>着丈</th></tr>${sRows}</table></div><div class="table-wrapper"><p><b>■ 上着詳細</b></p><table><tr><th>サイズ</th><th>肩幅</th><th>胸囲</th><th>袖丈</th><th>着丈</th></tr>${jRows}</table></div><div class="table-wrapper"><p><b>■ ズボン詳細</b></p><table><tr><th>サイズ</th><th>W実寸</th><th>ヒップ</th>${!isNavy?'<th>股上</th>':''}<th>ワタリ</th></tr>${pRows}</table></div>`;
    }

    function toggleTable() { const b = document.getElementById('table-content'), a = document.getElementById('arrow'); b.style.display = (b.style.display==="block")?"none":"block"; a.innerText = (b.style.display==="block")?"▲ 閉じる":"▼ 表示"; }
    function sel(btn, cat, val) { btn.parentElement.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); selections[cat]=val; updateSummary(); }
    function updateSummary() { const list = document.getElementById('summaryList'); list.innerHTML = ""; for (let k in selections) list.innerHTML += `<li>${k}: <b>${selections[k]}</b></li>`; }
    function copyResult() {
        let text = `【宝塚舞台 報告】氏名: ${document.getElementById('nameInput').value}\n----------------\n■ 選択サイズ\n`;
        for (let k in selections) text += `・${k}: ${selections[k]}\n`;
        navigator.clipboard.writeText(text).then(() => alert("申請内容をコピーしました。"));
    }
    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
    pose.onResults(onResults);
    startCamera();
</script>
</body>
</html>
