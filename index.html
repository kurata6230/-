<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI作業着採寸システム</title>
    <!-- MediaPipeのライブラリ読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 12px; shadow: 0 4px 12px rgba(0,0,0,0.1); padding: 20px; max-width: 500px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; color: #333; margin-top: 0; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.9rem; color: #666; margin-bottom: 5px; }
        input[type="number"] { width: 100%; padding: 10px; font-size: 1.1rem; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 3 / 4; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        .result-panel { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .result-box { background: #eef2ff; padding: 10px; border-radius: 8px; text-align: center; }
        .label-sm { font-size: 0.8rem; color: #555; }
        .value { font-size: 1.2rem; font-weight: bold; color: #1d4ed8; }
        .rec-size { grid-column: 1 / 3; background: #1d4ed8; color: white; padding: 15px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; }
        .guide-text { font-size: 0.85rem; color: #d97706; background: #fffbeb; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #fef3c7; }
    </style>
</head>
<body>

<div class="card">
    <h1>AI作業着採寸</h1>
    
    <div class="guide-text">
        【測定のコツ】<br>
        1. スマホを垂直に立てて床に置く<br>
        2. 全身が映るまで約3m離れる<br>
        3. 直立不動で数秒待つ
    </div>

    <div class="input-group">
        <label>あなたの身長 (cm)</label>
        <input type="number" id="heightInput" value="170" oninput="calculateSize()">
    </div>

    <div id="canvas-container">
        <video id="input_video"></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="result-panel">
        <div class="result-box">
            <div class="label-sm">推定肩幅</div>
            <div class="value"><span id="shoulderWidth">--</span> cm</div>
        </div>
        <div class="result-box">
            <div class="label-sm">推定身幅</div>
            <div class="value"><span id="chestWidth">--</span> cm</div>
        </div>
        <div class="rec-size" id="recommendedSize">
            判定中...
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    let currentShoulderCm = 0;

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1, radius: 3});

            // 座標の取得
            const leftShoulder = results.poseLandmarks[11];
            const rightShoulder = results.poseLandmarks[12];
            const leftHip = results.poseLandmarks[23];
            const rightHip = results.poseLandmarks[24];
            const nose = results.poseLandmarks[0];
            const leftAnkle = results.poseLandmarks[27];

            // 1. 画面上の基準となる高さ（鼻から足首）を計算
            const bodyPx = Math.abs(leftAnkle.y - nose.y) * 1.2; // 頭頂部までの補正
            
            // 2. 画面上の肩幅
            const shoulderPx = Math.sqrt(Math.pow(leftShoulder.x - rightShoulder.x, 2) + Math.pow(leftShoulder.y - rightShoulder.y, 2));
            
            // 3. 画面上の身幅（腰幅で代用）
            const chestPx = Math.sqrt(Math.pow(leftHip.x - rightHip.x, 2) + Math.pow(leftHip.y - rightHip.y, 2)) * 1.1;

            // 実測値換算
            const userHeight = parseFloat(document.getElementById('heightInput').value);
            if (bodyPx > 0) {
                currentShoulderCm = (shoulderPx / bodyPx) * userHeight;
                const chestCm = (chestPx / bodyPx) * userHeight;

                document.getElementById('shoulderWidth').innerText = currentShoulderCm.toFixed(1);
                document.getElementById('chestWidth').innerText = chestCm.toFixed(1);
                
                calculateSize();
            }
        }
        canvasCtx.restore();
    }

    function calculateSize() {
        const sizeBox = document.getElementById('recommendedSize');
        if (currentShoulderCm === 0) return;

        // 一般的な作業着のサイズ表に基づいた判定ロジック
        if (currentShoulderCm < 42) {
            sizeBox.innerText = "推奨：Sサイズ";
        } else if (currentShoulderCm < 46) {
            sizeBox.innerText = "推奨：Mサイズ";
        } else if (currentShoulderCm < 50) {
            sizeBox.innerText = "推奨：Lサイズ";
        } else if (currentShoulderCm < 54) {
            sizeBox.innerText = "推奨：LLサイズ";
        } else {
            sizeBox.innerText = "推奨：3L以上";
        }
    }

    const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await pose.send({image: videoElement});
        },
        width: 640,
        height: 480
    });
    camera.start();
</script>

</body>
</html>
